function buildStock() {
  if (state.stockView === 'suppliers') return buildSuppliersTab();
  const CAT_LABELS = {chemicals:'Chemicals',fuel:'Fuel',vehicle_generator_spares:'Vehicle & Generator Spares',electrical:'Electrical',plumbing:'Plumbing',paints_varnish:'Paints & Varnish',general_consumables:'General Consumables',ppe_uniform:'PPE & Uniform',kitchen:'Kitchen',bar:'Bar',housekeeping:'Housekeeping',guest_amenities:'Guest Amenities',tools_equipment:'Tools & Equipment',stationery:'Stationery'};
  const CAT_COLORS = {chemicals:'var(--red)',fuel:'var(--orange)',vehicle_generator_spares:'var(--sky)',electrical:'var(--accent)',plumbing:'var(--blue)',paints_varnish:'var(--green-hi)',general_consumables:'var(--text-sec)'};
  const ALL_CATS = Object.keys(CAT_LABELS);
  const filtered = state.stockCatFilter === 'all' ? state.stockItems : state.stockItems.filter(s => s.category === state.stockCatFilter);
  const lowStock = state.stockItems.filter(s => Number(s.minimum_level) > 0 && Number(s.stock_level) < Number(s.minimum_level));
  const totalValue = state.stockItems.reduce((sum,s) => sum + Number(s.stock_level)*Number(s.current_unit_cost||0), 0);
  const q = (state.stockSearch||'').toLowerCase().trim();
  const acResults = q.length >= 2 ? state.stockItems.filter(s => s.name.toLowerCase().includes(q) || (s.supplier_item_id||'').toLowerCase().includes(q)).slice(0,8) : [];
  const noMatch = q.length >= 2 && acResults.length === 0;

  return `
  <div class="col-gap">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px">
      <div class="section-title" style="margin-bottom:0">
        <div class="section-sub">— Operations Stockroom</div>
        <div class="section-h">Stock Management</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-ghost" onclick="setStockView('suppliers')">◈ Suppliers</button>
        <button class="btn btn-ghost" onclick="showModal('storeSetup')">&#9671; Stores</button>
        <button class="btn btn-ghost" onclick="navigate('govstock')">&#9670; Govt Stock</button>
        <button class="btn btn-ghost" onclick="showModal('stockOut')">Issue Stock</button>
        <button class="btn btn-ghost" onclick="showModal('stockIn')">Receive Delivery</button>
        <button class="btn btn-ghost" onclick="showModal('stocktake')">&#9633; Stock Take</button>
        <button class="btn btn-primary" onclick="showModal('stockItem')">+ New Item</button>
      </div>
    </div>

    <div class="grid-4">
      ${statCard('Stock Items', state.stockItems.length, 'registered', 'var(--accent-hi)')}
      ${statCard('Suppliers', state.suppliers.length, 'active', 'var(--sky)')}
      ${statCard('Low Stock', lowStock.length, 'alerts', lowStock.length > 0 ? 'var(--red)' : 'var(--green)')}
      ${statCard('Stock Value', 'R'+totalValue.toLocaleString('en-ZA',{maximumFractionDigits:0}), 'est.', 'var(--savanna)')}
    </div>

    <!-- Search -->
    <div class="card" style="padding:14px 16px">
      <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted);margin-bottom:8px;letter-spacing:1px">SEARCH — item name or supplier item ID</div>
      <div style="position:relative">
        <input class="form-input" id="stock-search" placeholder="Type to search existing stock, or enter new item name..."
          value="${escHtml(state.stockSearch||'')}" oninput="doStockSearch(this.value)" autocomplete="off">
        ${state.stockSearch ? `<button onclick="doStockSearch('')" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:18px">&#215;</button>` : ''}
      </div>
      ${acResults.length ? `
        <div style="margin-top:6px;border:1px solid var(--border);border-radius:var(--r);overflow:hidden">
          ${acResults.map((s,i) => {
            const col = CAT_COLORS[s.category]||'var(--text-muted)';
            const isLow = Number(s.minimum_level) > 0 && Number(s.stock_level) < Number(s.minimum_level);
            const sup = state.suppliers.find(x => x.id === s.preferred_supplier_id);
            return `
            <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--surface);${i>0?'border-top:1px solid var(--border)':''};cursor:pointer" onclick="openStockIn(${s.id})">
              <div>
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:3px">
                  <span style="font-family:'JetBrains Mono',monospace;font-size:9px;color:${col};background:color-mix(in srgb,${col} 15%,transparent);padding:1px 7px;border-radius:3px">${CAT_LABELS[s.category]||s.category}</span>
                  <span style="font-weight:700;font-size:13px;color:var(--text)">${escHtml(s.name)}</span>
                  ${s.supplier_item_id ? `<span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted);background:var(--surface-hi);padding:1px 6px;border-radius:3px">${escHtml(s.supplier_item_id)}</span>` : ''}
                </div>
                <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted)">
                  Current price: R${Number(s.current_unit_cost||0).toFixed(2)}/${s.unit} &nbsp;·&nbsp; Min level: ${s.minimum_level} ${s.unit}
                  ${s.storage_location ? ' &nbsp;·&nbsp; '+escHtml(s.storage_location) : ''}
                </div>
              </div>
              <div style="text-align:right;flex-shrink:0;margin-left:14px">
                <div style="font-size:18px;font-weight:800;color:${isLow?'var(--red)':'var(--text)'}">${s.stock_level}<span style="font-size:11px;font-weight:400;color:var(--text-sec)"> ${s.unit}</span></div>
                ${isLow ? `<div style="font-size:9px;color:var(--red);font-family:'JetBrains Mono',monospace">BELOW MIN (${s.minimum_level})</div>` : ''}
              </div>
            </div>`;
          }).join('')}
        </div>
      ` : noMatch ? `
        <div style="margin-top:8px;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--surface);border-radius:var(--r);border:1px solid var(--border)">
          <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-muted)">No item found for &ldquo;${escHtml(state.stockSearch)}&rdquo;</span>
          <button class="btn btn-primary" style="font-size:10px;padding:4px 12px" onclick="showModal('stockIn')">+ Receive New Item</button>
        </div>
      ` : ''}
    </div>

    ${lowStock.length > 0 ? `
    <div class="card" style="border-color:color-mix(in srgb,var(--red) 40%,var(--border));background:color-mix(in srgb,var(--red) 5%,var(--dark-mid))">
      <div class="card-title" style="color:var(--red)">&#8855; Low Stock Alerts</div>
      ${lowStock.map(s => {
        const sup = state.suppliers.find(x => x.id === s.preferred_supplier_id);
        return `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:color-mix(in srgb,var(--red) 8%,transparent);border-radius:var(--r);margin-bottom:5px">
          <div>
            <span style="font-size:13px;font-weight:600;color:var(--text)">${escHtml(s.name)}</span>
            ${sup ? `<span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted);margin-left:10px">${escHtml(sup.name)}${sup.phone?' · '+escHtml(sup.phone):''}</span>` : ''}
          </div>
          <div style="display:flex;align-items:center;gap:10px">
            <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--red)">${s.stock_level} / min ${s.minimum_level} ${s.unit}</span>
            <button class="btn btn-ghost" style="font-size:9px;padding:3px 8px" onclick="openStockIn(${s.id})">Receive</button>
          </div>
        </div>`;
      }).join('')}
    </div>` : ''}

    <!-- Category tabs -->
    <div class="filter-row" style="flex-wrap:wrap">
      <button class="filter-btn ${state.stockCatFilter==='all'?'active':''}" onclick="setStockFilter('all')">ALL (${state.stockItems.length})</button>
      ${(() => {
  const GROUPS = [
    {label:'Kitchen & Bar', cats:['kitchen','bar']},
    {label:'Housekeeping', cats:['housekeeping','guest_amenities']},
    {label:'Chemicals', cats:['chemicals']},
    {label:'PPE & Uniform', cats:['ppe_uniform']},
    {label:'Fuel & Vehicles', cats:['fuel','vehicle_generator_spares']},
    {label:'Maintenance', cats:['electrical','plumbing','paints_varnish','general_consumables','tools_equipment']},
    {label:'Stationery', cats:['stationery']},
  ];
  return GROUPS.map(({label, cats}) => {
    const n = cats.reduce((s,cat) => s + state.stockItems.filter(i => i.category===cat).length, 0);
    if (!n) return '';
    const isActive = cats.includes(state.stockCatFilter);
    const hasLow = cats.some(cat => state.stockItems.some(i => i.category===cat&&Number(i.minimum_level)>0&&Number(i.stock_level)<Number(i.minimum_level)));
    return `<button class="filter-btn ${isActive?'active':''}" onclick="setStockFilter('${cats[0]}')" style="${hasLow?'border-color:var(--red);color:var(--red)':''}">${label}</button>`;
  }).join('');
})()}
      <button class="filter-btn ${state.stockCatFilter==='suppliers'?'active':''}" onclick="setStockFilter('suppliers')" style="margin-left:auto">&#9671; SUPPLIERS (${state.suppliers.length})</button>
    </div>

    <!-- Stock list / Suppliers tab -->
    ${state.stockCatFilter === 'suppliers' ? `
    <div class="col-gap" style="gap:8px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted);letter-spacing:1px">SUPPLIER DIRECTORY</div>
        <button class="btn btn-primary" style="font-size:11px;padding:5px 14px" onclick="showModal('supplier')">+ Add Supplier</button>
      </div>
      ${state.suppliers.length ? state.suppliers.map(s => `
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px">
            <div>
              <div style="font-size:15px;font-weight:700;color:var(--text);margin-bottom:6px">${escHtml(s.name)}</div>
              <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-muted);display:flex;flex-direction:column;gap:3px">
                ${s.contact_person?`<span>Contact: ${escHtml(s.contact_person)}</span>`:''}
                ${s.phone?`<span>&#128222; ${escHtml(s.phone)}</span>`:''}
                ${s.email?`<span>&#9993; ${escHtml(s.email)}</span>`:''}
                ${s.account_number?`<span>Acc: ${escHtml(s.account_number)}</span>`:''}
                ${s.address?`<span>&#128204; ${escHtml(s.address)}</span>`:''}
                ${s.notes?`<span style="color:var(--text-sec)">${escHtml(s.notes)}</span>`:''}
              </div>
            </div>
            <div style="text-align:right;flex-shrink:0">
              <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted)">
                ${state.stockItems.filter(i=>i.preferred_supplier_id===s.id).length} items
              </div>
              <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted);margin-top:2px">
                ${state.stockMovements.filter(m=>m.supplier_id===s.id).length} deliveries
              </div>
            </div>
          </div>
        </div>
      `).join('') : `<div class="empty card">No suppliers added yet — click Add Supplier to get started</div>`}
    </div>
    ` : `
    <div class="col-gap" style="gap:8px">
      ${filtered.length ? filtered.map(s => {
        const col = CAT_COLORS[s.category]||'var(--text-muted)';
        const isLow = Number(s.minimum_level) > 0 && Number(s.stock_level) < Number(s.minimum_level);
        const pct = Number(s.minimum_level) > 0 ? Math.min(Number(s.stock_level)/Number(s.minimum_level)*33, 100) : 50;
        const moves = state.stockMovements.filter(m => m.stock_item_id === s.id);
        const totalIn  = moves.filter(m=>m.movement_type==='in').reduce((x,m)=>x+Number(m.quantity||0),0);
        const totalOut = moves.filter(m=>m.movement_type==='out').reduce((x,m)=>x+Number(m.quantity||0),0);
        const estValue = Number(s.stock_level)*Number(s.current_unit_cost||0);
        return `
        <div class="card" style="${isLow?'border-color:color-mix(in srgb,var(--red) 40%,var(--border))':''}">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
            <div style="flex:1;min-width:0">
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px">
                <span style="font-family:'JetBrains Mono',monospace;font-size:9px;color:${col};background:color-mix(in srgb,${col} 15%,transparent);padding:2px 7px;border-radius:3px;border:1px solid color-mix(in srgb,${col} 25%,transparent);white-space:nowrap">${CAT_LABELS[s.category]||s.category}</span>
                <span style="font-size:15px;font-weight:700;color:var(--text)">${escHtml(s.name)}</span>
                ${s.supplier_item_id ? `<span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted);background:var(--surface-hi);padding:1px 6px;border-radius:3px">${escHtml(s.supplier_item_id)}</span>` : ''}
              </div>
              <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted);display:flex;gap:14px;flex-wrap:wrap">
                <span>Current price: <span style="color:var(--savanna)">R${Number(s.current_unit_cost||0).toFixed(2)}/${s.unit}</span></span>
                ${s.storage_location ? `<span>&#128204; ${escHtml(s.storage_location)}</span>` : ''}
                ${s.sds_ref ? `<a href="${escHtml(s.sds_ref)}" target="_blank" style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--sky);text-decoration:none">SDS &#8599;</a>` : ''}
                ${s.ppe_required && s.category==='chemicals' ? `<span style="color:var(--orange)">PPE: ${escHtml(s.ppe_required)}</span>` : ''}
                <span>Total in: ${totalIn} ${s.unit}</span>
                <span>Total out: ${totalOut} ${s.unit}</span>
                ${estValue > 0 ? `<span style="color:var(--savanna)">Value: R${estValue.toLocaleString('en-ZA',{maximumFractionDigits:0})}</span>` : ''}

              </div>
            </div>
            <div style="text-align:right;flex-shrink:0;margin-left:12px">
              <div style="font-size:22px;font-weight:800;color:${isLow?'var(--red)':'var(--text)'};letter-spacing:-1px">${s.stock_level}<span style="font-size:12px;font-weight:400;color:var(--text-sec)"> ${s.unit}</span></div>
              ${isLow ? `<div style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--red)">MIN: ${s.minimum_level}</div>` : ''}
            </div>
          </div>
          <div style="height:4px;background:var(--surface-hi);border-radius:2px;margin-bottom:8px">
            <div style="height:100%;width:${pct}%;background:${isLow?'var(--red)':col};border-radius:2px;transition:width 0.4s"></div>
          </div>
          <div style="display:flex;gap:6px">
            <button class="btn btn-ghost" style="font-size:10px;padding:4px 10px" onclick="openStockIn(${s.id})">+ Receive</button>
            <button class="btn btn-ghost" style="font-size:10px;padding:4px 10px" onclick="openStockOut(${s.id})">&#8722; Issue</button>
            <button class="btn btn-ghost" style="font-size:10px;padding:4px 10px;margin-left:auto" onclick="openEditStock(${s.id})">&#9998; Edit</button>
            ${Number(s.stock_level) === 0 ? `<button class="btn btn-ghost" style="font-size:10px;padding:4px 10px;color:var(--red);border-color:color-mix(in srgb,var(--red) 30%,var(--border))" onclick="deleteStockItem(${s.id},'${escHtml(s.name).replace(/'/g,'\\&apos;')}')">&#215; Delete</button>` : ''}
          </div>
        </div>`;
      }).join('') : `<div class="empty card">No stock items ${state.stockCatFilter!=='all'?'in this category ':''}&mdash; click New Item to add</div>`}
    </div>

    <!-- Recent movements -->
    ${state.stockMovements.length ? `
    <div class="card">
      <div class="card-title">&#9701; Recent Movements</div>
      <div class="col-gap" style="gap:5px">
        ${state.stockMovements.slice(0,12).map(m => {
          const item = state.stockItems.find(s => s.id === m.stock_item_id);
          const sup  = state.suppliers.find(s => s.id === m.supplier_id);
          const task = state.tasks.find(t => t.id === m.task_id);
          const isIn = m.movement_type === 'in';
          return `
          <div class="log-row">
            <div style="display:flex;align-items:center;gap:10px">
              <span style="font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;color:${isIn?'var(--green)':'var(--orange)'};background:color-mix(in srgb,${isIn?'var(--green)':'var(--orange)'} 12%,transparent);padding:2px 8px;border-radius:3px;min-width:32px;text-align:center">${isIn?'IN':'OUT'}</span>
              <div>
                <div style="font-size:13px;font-weight:700;color:var(--text)">${item?escHtml(item.name):'?'} &mdash; ${m.quantity} ${item?item.unit:''} ${Number(m.total_cost||0)>0?'(R'+Number(m.total_cost).toLocaleString('en-ZA',{maximumFractionDigits:0})+')':''}</div>
                <div class="log-meta">${m.recorded_by||'&mdash;'} ${sup?' &middot; '+escHtml(sup.name):''} ${task?' &middot; '+escHtml(task.title):''} ${m.invoice_ref?' &middot; Inv: '+escHtml(m.invoice_ref):''}</div>
              </div>
            </div>
            <div class="log-meta">${m.movement_date||''}</div>
          </div>`;
        }).join('')}
      </div>
    </div>` : ''}

  `}
  </div>`;
}

// REPAIRS — OFF-SITE TRACKING
// ═══════════════════════════════════════
function buildRepairs() {
  const active   = state.repairs.filter(r => r.status !== 'returned');
  const returned = state.repairs.filter(r => r.status === 'returned');
  const overdue  = active.filter(r => r.expected_return && r.expected_return < new Date().toISOString().slice(0,10));

  return `
  <div class="col-gap">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px">
      <div class="section-title" style="margin-bottom:0">
        <div class="section-sub">— Off-site</div>
        <div class="section-h">Repairs Tracking</div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost" onclick="navigate('assets')">&#8592; Assets</button>
        <button class="btn btn-primary" onclick="showModal('newRepair')">+ Log Repair</button>
      </div>
    </div>

    <div class="grid-3">
      ${statCard('Off-site', active.length, 'items', active.length>0?'var(--orange)':'var(--green)')}
      ${statCard('Overdue', overdue.length, 'returns', overdue.length>0?'var(--red)':'var(--green)')}
      ${statCard('Returned', returned.length, 'total', 'var(--sky)')}
    </div>

    ${overdue.length ? `
    <div class="card" style="border-color:color-mix(in srgb,var(--red) 40%,var(--border));background:color-mix(in srgb,var(--red) 5%,var(--dark-mid))">
      <div class="card-title" style="color:var(--red)">&#8855; Overdue Returns</div>
      ${overdue.map(r => `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:color-mix(in srgb,var(--red) 8%,transparent);border-radius:var(--r);margin-bottom:5px">
          <div>
            <span style="font-weight:700;font-size:13px;color:var(--text)">${escHtml(r.asset_name||'Unknown asset')}</span>
            <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted);margin-left:10px">at ${escHtml(r.sent_to||'—')}</span>
          </div>
          <div style="display:flex;align-items:center;gap:10px">
            <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--red)">Due: ${fmtDate(r.expected_return)}</span>
            <button class="btn btn-ghost" style="font-size:9px;padding:3px 8px" onclick="markRepairReturned(${r.id})">Mark Returned</button>
          </div>
        </div>`).join('')}
    </div>` : ''}

    <!-- Active repairs -->
    ${active.length ? `
    <div class="card">
      <div class="card-title">&#9698; Currently Off-site</div>
      <div class="col-gap" style="gap:6px">
        ${active.map(r => {
          const isOverdue = r.expected_return && r.expected_return < new Date().toISOString().slice(0,10);
          return `
          <div style="display:flex;justify-content:space-between;align-items:flex-start;padding:10px 12px;background:var(--surface);border-radius:var(--r);border:1px solid ${isOverdue?'color-mix(in srgb,var(--red) 40%,var(--border))':'var(--border)'}">
            <div>
              <div style="font-weight:700;font-size:13px;color:var(--text);margin-bottom:4px">${escHtml(r.asset_name||'Asset')}</div>
              <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted);display:flex;gap:12px;flex-wrap:wrap">
                <span>Sent to: ${escHtml(r.sent_to||'—')}</span>
                <span>Sent: ${fmtDate(r.sent_date)}</span>
                ${r.expected_return?`<span style="color:${isOverdue?'var(--red)':'var(--text-sec)'}">Expected back: ${fmtDate(r.expected_return)}</span>`:''}
                ${Number(r.cost||0)>0?`<span style="color:var(--savanna)">Est cost: R${Number(r.cost).toLocaleString('en-ZA',{maximumFractionDigits:0})}</span>`:''}
              </div>
              ${r.description?`<div style="font-size:12px;color:var(--text-sec);margin-top:4px">${escHtml(r.description)}</div>`:''}
            </div>
            <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end;flex-shrink:0;margin-left:12px">
              <span style="font-family:'JetBrains Mono',monospace;font-size:9px;color:${isOverdue?'var(--red)':'var(--orange)'};background:color-mix(in srgb,${isOverdue?'var(--red)':'var(--orange)'} 15%,transparent);padding:2px 8px;border-radius:3px">${isOverdue?'OVERDUE':'OFF-SITE'}</span>
              <button class="btn btn-ghost" style="font-size:10px;padding:4px 10px" onclick="markRepairReturned(${r.id})">&#10003; Returned</button>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>` : `<div class="empty card">No assets currently off-site for repairs</div>`}

    <!-- Repair history -->
    ${returned.length ? `
    <div class="card">
      <div class="card-title">&#10003; Repair History</div>
      <div class="col-gap" style="gap:5px">
        ${returned.slice(0,10).map(r => `
          <div class="log-row">
            <div style="display:flex;align-items:center;gap:10px">
              <span style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--green);background:color-mix(in srgb,var(--green) 12%,transparent);padding:2px 8px;border-radius:3px">RETURNED</span>
              <div>
                <div style="font-size:13px;font-weight:700;color:var(--text)">${escHtml(r.asset_name||'Asset')}</div>
                <div class="log-meta">${escHtml(r.sent_to||'—')} &middot; ${fmtDate(r.sent_date)} &rarr; ${fmtDate(r.actual_return)} ${Number(r.cost||0)>0?' &middot; R'+Number(r.cost).toLocaleString('en-ZA',{maximumFractionDigits:0}):''}</div>
              </div>
            </div>
            <div class="log-meta">${fmtDate(r.actual_return)}</div>
          </div>`).join('')}
      </div>
    </div>` : ''}
  </div>`;
}

// ═══════════════════════════════════════
// RECONCILIATION
// ═══════════════════════════════════════
function buildReconciliation() {
  const recs = state.reconciliations;
  const draftRec = recs.find(r => r.status === 'draft');
  const finalisedRecs = recs.filter(r => r.status === 'finalised');
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const REASONS = ['Damaged / written off','Lost / stolen','Counting error','Consumed but not issued','Supplier short delivery','Other'];

  // If viewing a specific reconciliation detail
  if (state.viewingReconId) {
    const rec = recs.find(r => r.id === state.viewingReconId);
    if (!rec) return '';
    const items = state.reconItems;
    const varItems = items.filter(i => Number(i.variance||0) !== 0);
    const totalVarVal = items.reduce((s,i) => s + Number(i.variance_value||0), 0);
    const isDraft = rec.status === 'draft';

    return `
    <div class="col-gap">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
        <div style="display:flex;align-items:center;gap:12px">
          <button class="btn btn-ghost" style="font-size:11px" onclick="closeReconDetail()">&#8592; Back</button>
          <div>
            <div class="section-h" style="font-size:18px;margin:0">${escHtml(rec.period_label)}</div>
            <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:${isDraft?'var(--orange)':'var(--green)'}">${rec.status.toUpperCase()}${rec.finalised_at?' — finalised '+fmtDate(rec.finalised_at):''}</div>
          </div>
        </div>
        ${isDraft ? `
        <div style="display:flex;gap:8px">
          <button class="btn btn-ghost" onclick="saveReconDraft()">Save Draft</button>
          <button class="btn btn-primary" onclick="finaliseRecon(${rec.id})">&#10003; Finalise & Lock</button>
        </div>` : ''}
      </div>

      <div class="grid-4">
        ${statCard('Items Counted', items.length, 'total', 'var(--accent-hi)')}
        ${statCard('Variances', varItems.length, 'items', varItems.length > 0 ? 'var(--orange)' : 'var(--green)')}
        ${statCard('Variance Value', 'R'+Math.abs(totalVarVal).toLocaleString('en-ZA',{maximumFractionDigits:0}), totalVarVal < 0 ? 'loss' : 'gain', totalVarVal < 0 ? 'var(--red)' : 'var(--green)')}
        ${statCard('Status', rec.status.toUpperCase(), '', isDraft ? 'var(--orange)' : 'var(--green)')}
      </div>

      ${varItems.length && !isDraft ? `
      <div class="card" style="border-color:color-mix(in srgb,var(--orange) 40%,var(--border))">
        <div class="card-title" style="color:var(--orange)">&#9650; Variance Summary</div>
        ${varItems.map(i => {
          const isShort = Number(i.variance) < 0;
          return `
          <div style="display:flex;justify-content:space-between;align-items:center;padding:7px 10px;background:color-mix(in srgb,${isShort?'var(--red)':'var(--green)'} 6%,transparent);border-radius:var(--r);margin-bottom:4px">
            <div>
              <span style="font-weight:600;font-size:13px;color:var(--text)">${escHtml(i.item_name)}</span>
              <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted);margin-left:10px">${escHtml(i.variance_reason||'—')}</span>
            </div>
            <div style="text-align:right">
              <div style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:${isShort?'var(--red)':'var(--green)'}">${isShort?'':'+'}${i.variance} ${i.unit}</div>
              <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted)">R${Number(i.variance_value).toLocaleString('en-ZA',{maximumFractionDigits:0})}</div>
            </div>
          </div>`;
        }).join('')}
      </div>` : ''}

      <!-- Count sheet -->
      <div class="card" style="padding:0;overflow:hidden">
        <div style="padding:12px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">
          <div class="card-title" style="margin:0">Count Sheet</div>
          ${isDraft ? `<div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted)">Enter physical counts — variances calculate automatically</div>` : ''}
        </div>
        <div style="overflow-x:auto">
          <table style="width:100%;border-collapse:collapse;font-size:12px">
            <thead>
              <tr style="background:var(--surface)">
                <th style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted);padding:8px 12px;text-align:left;border-bottom:2px solid var(--border);white-space:nowrap">ITEM</th>
                <th style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted);padding:8px 12px;text-align:left;border-bottom:2px solid var(--border)">CATEGORY</th>
                <th style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted);padding:8px 12px;text-align:right;border-bottom:2px solid var(--border)">SYSTEM QTY</th>
                <th style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted);padding:8px 12px;text-align:right;border-bottom:2px solid var(--border)">PHYSICAL COUNT</th>
                <th style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted);padding:8px 12px;text-align:right;border-bottom:2px solid var(--border)">VARIANCE</th>
                <th style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted);padding:8px 12px;text-align:right;border-bottom:2px solid var(--border)">VALUE</th>
                <th style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted);padding:8px 12px;text-align:left;border-bottom:2px solid var(--border)">REASON</th>
              </tr>
            </thead>
            <tbody>
              ${items.map((item, idx) => {
                const phys = item.physical_qty !== null && item.physical_qty !== undefined ? Number(item.physical_qty) : null;
                const variance = phys !== null ? phys - Number(item.system_qty) : null;
                const varVal = variance !== null ? variance * Number(item.unit_cost||0) : null;
                const hasVar = variance !== null && variance !== 0;
                return `
                <tr style="border-bottom:1px solid color-mix(in srgb,var(--border) 50%,transparent);${hasVar?'background:color-mix(in srgb,var(--orange) 4%,transparent)':''}">
                  <td style="padding:6px 12px;font-weight:600;color:var(--text)">${escHtml(item.item_name)}</td>
                  <td style="padding:6px 12px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted)">${escHtml(item.category||'')}</td>
                  <td style="padding:6px 12px;font-family:'JetBrains Mono',monospace;text-align:right;color:var(--text-sec)">${item.system_qty} ${item.unit}</td>
                  <td style="padding:4px 8px;text-align:right">
                    ${isDraft
                      ? `<input class="form-input" id="ri-${item.id}" type="number" step="0.01" value="${phys !== null ? phys : ''}" placeholder="count" style="width:80px;text-align:right;padding:4px 6px;font-size:12px" oninput="updateReconRow(${item.id},this.value,${idx})">`
                      : `<span style="font-family:'JetBrains Mono',monospace;color:var(--text)">${phys !== null ? phys + ' ' + item.unit : '—'}</span>`}
                  </td>
                  <td style="padding:6px 12px;font-family:'JetBrains Mono',monospace;font-weight:700;text-align:right;color:${variance===null?'var(--text-muted)':variance<0?'var(--red)':variance>0?'var(--green)':'var(--text-sec)'}">
                    <span id="rv-${item.id}">${variance !== null ? (variance > 0 ? '+' : '') + variance + ' ' + item.unit : '—'}</span>
                  </td>
                  <td style="padding:6px 12px;font-family:'JetBrains Mono',monospace;text-align:right;color:${varVal!==null&&varVal<0?'var(--red)':varVal!==null&&varVal>0?'var(--green)':'var(--text-muted)'}">
                    <span id="rvv-${item.id}">${varVal !== null ? 'R'+Number(varVal).toLocaleString('en-ZA',{maximumFractionDigits:0}) : '—'}</span>
                  </td>
                  <td style="padding:4px 8px">
                    ${isDraft && hasVar
                      ? `<select class="form-select" id="rr-${item.id}" style="font-size:10px;padding:3px 4px" onchange="updateReconReason(${item.id},this.value)">
                          <option value="">— Reason —</option>
                          ${REASONS.map(r=>`<option value="${r}" ${item.variance_reason===r?'selected':''}>${r}</option>`).join('')}
                        </select>`
                      : `<span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted)">${escHtml(item.variance_reason||'')}</span>`}
                  </td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>`;
  }

  // ── LIST VIEW ──
  return `
  <div class="col-gap">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px">
      <div class="section-title" style="margin-bottom:0">
        <div class="section-sub">— Monthly</div>
        <div class="section-h">Stock Reconciliation</div>
      </div>
      ${!draftRec ? `<button class="btn btn-primary" onclick="startNewRecon()">+ New Stock Take</button>` : `<button class="btn btn-primary" onclick="openReconDetail(${draftRec.id})">Continue Draft — ${escHtml(draftRec.period_label)}</button>`}
    </div>

    <div class="grid-3">
      ${statCard('Total Reconciliations', recs.length, 'completed', 'var(--accent-hi)')}
      ${statCard('Draft', draftRec ? '1' : '0', 'in progress', draftRec ? 'var(--orange)' : 'var(--text-muted)')}
      ${statCard('Finalised', finalisedRecs.length, 'locked', 'var(--green)')}
    </div>

    ${draftRec ? `
    <div class="card" style="border-color:color-mix(in srgb,var(--orange) 40%,var(--border));background:color-mix(in srgb,var(--orange) 5%,var(--dark-mid))">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <div class="card-title" style="color:var(--orange);margin-bottom:2px">&#9650; Draft in Progress — ${escHtml(draftRec.period_label)}</div>
          <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted)">Started ${fmtDate(draftRec.created_at)} — not yet finalised or locked</div>
        </div>
        <button class="btn btn-primary" onclick="openReconDetail(${draftRec.id})">Continue &#8594;</button>
      </div>
    </div>` : ''}

    ${finalisedRecs.length ? `
    <div class="card">
      <div class="card-title">&#10003; Finalised Reconciliations</div>
      <div class="col-gap" style="gap:6px">
        ${finalisedRecs.map(r => {
          const varVal = Number(r.total_variance_value||0);
          return `
          <div class="log-row" style="cursor:pointer" onclick="openReconDetail(${r.id})">
            <div style="display:flex;align-items:center;gap:12px">
              <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--green);background:color-mix(in srgb,var(--green) 12%,transparent);padding:2px 8px;border-radius:3px">LOCKED</span>
              <div>
                <div style="font-size:13px;font-weight:700;color:var(--text)">${escHtml(r.period_label)}</div>
                <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted)">Finalised ${fmtDate(r.finalised_at)} ${r.finalised_by?'by '+escHtml(r.finalised_by):''}</div>
              </div>
            </div>
            <div style="text-align:right">
              <div style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:${varVal<0?'var(--red)':varVal>0?'var(--orange)':'var(--green)'}">
                ${varVal === 0 ? 'No variance' : 'R'+Math.abs(varVal).toLocaleString('en-ZA',{maximumFractionDigits:0})+' '+(varVal<0?'loss':'gain')}
              </div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>` : `<div class="empty card">No finalised reconciliations yet — start a new stock take above</div>`}
  </div>`;
}

// FUEL
// ═══════════════════════════════════════
function buildFuel() {
  const VEHICLE_TYPES = ['4x4 / Game Viewer','Bakkie / LDV','Generator','Tractor','TLB / Loader','Golf Cart','Quad bike / ATV','Water Pump'];
  const vehicles = state.assets.filter(a => VEHICLE_TYPES.includes(a.asset_type) || a.category === 'high_value');
  const thisMonth = new Date().toISOString().slice(0,7);
  const monthLogs = state.fuelLogs.filter(l => (l.log_date||'').slice(0,7) === thisMonth);
  const totalLitresMth = monthLogs.reduce((s,l) => s+Number(l.litres||0), 0);
  const anomalies = state.fuelLogs.filter(l => l.anomaly_flag !== 'ok').slice(0,5);
  const lowAreas  = state.fuelAreas.filter(a => Number(a.minimum_litres)>0 && Number(a.current_litres)<Number(a.minimum_litres));
  return `
  <div class="col-gap">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px">
      <div class="section-title" style="margin-bottom:0">
        <div class="section-sub">— Fleet & Machinery</div>
        <div class="section-h">Fuel Management</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-ghost" onclick="showModal('fuelAreaSetup')">&#9671; Fuel Areas</button>
        <button class="btn btn-ghost" onclick="showModal('fuelDelivery')">+ Receive Delivery</button>
        <button class="btn btn-primary" onclick="showModal('fuelLog')">+ Issue Fuel</button>
      </div>
    </div>
    <div class="grid-4">
      ${statCard('Issued This Month', totalLitresMth.toFixed(0)+' L', 'total', 'var(--orange)')}
      ${statCard('Fuel Areas', state.fuelAreas.length, 'tanks', 'var(--sky)')}
      ${statCard('Low Fuel', lowAreas.length, 'alerts', lowAreas.length>0?'var(--red)':'var(--green)')}
      ${statCard('Anomalies', anomalies.length, 'flagged', anomalies.length>0?'var(--red)':'var(--green)')}
    </div>
    ${state.fuelAreas.length ? `
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px">
      ${state.fuelAreas.map(area => {
        const pct = area.capacity_litres > 0 ? Math.min(Number(area.current_litres)/Number(area.capacity_litres)*100,100) : 50;
        const isLow = Number(area.minimum_litres)>0 && Number(area.current_litres)<Number(area.minimum_litres);
        const TYPE_COL = {diesel:'var(--orange)',petrol:'var(--green)',oil:'var(--savanna)',hydraulic:'var(--sky)',lpgas:'var(--blue)',other:'var(--text-sec)'};
        const col = TYPE_COL[area.fuel_type] || 'var(--orange)';
        return `
        <div class="card" style="${isLow?'border-color:color-mix(in srgb,var(--red) 40%,var(--border))':''}">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
            <div>
              <div style="font-size:13px;font-weight:700;color:var(--text)">${escHtml(area.name)}</div>
              <div style="font-family:'JetBrains Mono',monospace;font-size:9px;color:${col}">${(area.fuel_type||'diesel').toUpperCase()}</div>
            </div>
            <div style="text-align:right">
              <div style="font-size:20px;font-weight:800;color:${isLow?'var(--red)':'var(--text)'}">${Number(area.current_litres).toFixed(0)}<span style="font-size:10px;color:var(--text-sec)"> L</span></div>
              ${area.capacity_litres>0?`<div style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted)">of ${Number(area.capacity_litres).toFixed(0)} L</div>`:''}
            </div>
          </div>
          <div style="height:6px;background:var(--surface-hi);border-radius:3px;margin-bottom:8px">
            <div style="height:100%;width:${pct}%;background:${isLow?'var(--red)':col};border-radius:3px"></div>
          </div>
          ${isLow?`<div style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--red);margin-bottom:6px">&#8855; Below minimum (${Number(area.minimum_litres).toFixed(0)} L)</div>`:''}
          <div style="display:flex;gap:6px">
            <button class="btn btn-ghost" style="font-size:10px;padding:3px 8px;flex:1" onclick="openFuelDelivery(${area.id})">+ Fill</button>
            <button class="btn btn-primary" style="font-size:10px;padding:3px 8px;flex:1" onclick="openFuelLog(null,${area.id})">Issue</button>
          </div>
        </div>`;
      }).join('')}
    </div>` : `
    <div class="card" style="border-color:color-mix(in srgb,var(--accent) 25%,var(--border))">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <div style="font-size:13px;font-weight:600;color:var(--text)">No fuel areas set up yet</div>
          <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted)">Add Diesel Tank, Petrol Tank, Garage etc.</div>
        </div>
        <button class="btn btn-primary" onclick="showModal('fuelAreaSetup')">+ Setup Fuel Areas</button>
      </div>
    </div>`}
    ${anomalies.length ? `
    <div class="card" style="border-color:color-mix(in srgb,var(--red) 40%,var(--border))">
      <div class="card-title" style="color:var(--red)">&#9888; Anomalies</div>
      ${anomalies.map(l=>{const d=Number(l.meter_end)-Number(l.meter_start);const r=d>0?(Number(l.litres)/d).toFixed(3):'—';return`<div style="display:flex;justify-content:space-between;padding:6px 10px;background:color-mix(in srgb,var(--red) 8%,transparent);border-radius:var(--r);margin-bottom:4px"><span style="font-size:12px;color:var(--text);font-weight:600">${escHtml(l.asset_name||'?')}</span><span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--red)">${l.litres}L / ${d} ${l.meter_unit} = ${r} — ${(l.anomaly_flag||'').toUpperCase()}</span></div>`;}).join('')}
    </div>` : ''}
    ${vehicles.length ? `
    <div class="card">
      <div class="card-title">&#9698; Fleet</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px">
        ${vehicles.map(a=>{const logs=state.fuelLogs.filter(l=>l.asset_id===a.id);const tot=logs.reduce((s,l)=>s+Number(l.litres||0),0);const isHrs=a.tracking_unit==='hrs';return`<div style="padding:10px 12px;background:var(--surface);border-radius:var(--r);border:1px solid var(--border)"><div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:2px">${escHtml(a.asset_name)}</div><div style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted);margin-bottom:6px">${escHtml(a.asset_type||'—')}</div><div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent)">${Number(a.current_reading||0).toLocaleString()} ${isHrs?'hrs':'km'}</div><div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--orange)">${tot.toFixed(0)} L total</div><button class="btn btn-primary" style="font-size:10px;padding:4px 10px;width:100%;margin-top:8px" onclick="openFuelLog(${a.id},null)">+ Log Fuel</button></div>`;}).join('')}
      </div>
    </div>` : ''}
    ${state.fuelLogs.length ? `
    <div class="card">
      <div class="card-title">&#9670; Recent Issues</div>
      <div style="overflow-x:auto">
        <table style="width:100%;border-collapse:collapse;font-size:12px">
          <thead><tr style="background:var(--surface)">${['DATE','VEHICLE','TANK','LITRES','ISSUED TO','FLAG'].map(h=>`<th style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted);padding:6px 8px;text-align:left;border-bottom:2px solid var(--border);white-space:nowrap">${h}</th>`).join('')}</tr></thead>
          <tbody>${state.fuelLogs.slice(0,15).map(l=>{const fc=l.anomaly_flag==='high'?'var(--red)':l.anomaly_flag==='low'?'var(--orange)':'var(--green)';return`<tr style="border-bottom:1px solid color-mix(in srgb,var(--border) 50%,transparent)"><td style="padding:5px 8px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted)">${l.log_date||''}</td><td style="padding:5px 8px;font-weight:600;color:var(--text)">${escHtml(l.asset_name||'—')}</td><td style="padding:5px 8px;font-size:10px;color:var(--text-muted)">${escHtml(l.fuel_area_name||'—')}</td><td style="padding:5px 8px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--orange);font-weight:700">${l.litres} L</td><td style="padding:5px 8px;font-size:10px;color:var(--text-sec)">${escHtml(l.issued_to_name||l.logged_by||'—')}</td><td style="padding:5px 8px;font-family:'JetBrains Mono',monospace;font-size:9px;color:${fc}">${(l.anomaly_flag||'ok').toUpperCase()}</td></tr>`;}).join('')}</tbody>
        </table>
      </div>
    </div>` : ''}
  </div>`;
}

// STAFF

function buildStaff() {
  const view = state.staffView || 'register';
  if (view === 'calendar') return buildLeaveCalendar();
  if (view === 'leave') return buildLeaveManagement();
  const active = state.staff.filter(s => s.is_active !== false);
  const inactive = state.staff.filter(s => s.is_active === false);
  const filter = state.staffFilter || 'all';
  const filtered = filter === 'all' ? active : active.filter(s => s.department === filter);
  const DEPTS = ['Management','Butlers','Housekeeping','Kitchen','Guides','Farm','Spa','Maintenance','Security','Administration'];
  const deptCounts = {};
  active.forEach(s => { if(s.department) deptCounts[s.department] = (deptCounts[s.department]||0)+1; });
  const pendingLeave = (state.leaveRequests||[]).filter(l => l.status === 'pending');
  const licExpiring = active.filter(s => s.license_expiry && new Date(s.license_expiry) < new Date(Date.now()+90*24*3600*1000));
  const pdpExpiring = active.filter(s => s.pdp_expiry && new Date(s.pdp_expiry) < new Date(Date.now()+90*24*3600*1000));
  return `
  <div class="col-gap">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px">
      <div class="section-title" style="margin-bottom:0"><div class="section-sub">— Human Resources</div><div class="section-h">Staff Register</div></div>
      <button class="btn btn-primary" onclick="showModal('newStaff')">+ Add Staff Member</button>
    </div>
    <div class="filter-row">
      <button class="filter-btn ${view==='register'?'active':''}" onclick="setStaffView('register')">&#9671; REGISTER</button>
      <button class="filter-btn ${view==='calendar'?'active':''}" onclick="setStaffView('calendar')">&#9633; LEAVE CALENDAR ${pendingLeave.length>0?'('+pendingLeave.length+' pending)':''}</button>
      <button class="filter-btn ${view==='leave'?'active':''}" onclick="setStaffView('leave')">&#9670; LEAVE REQUESTS</button>
    </div>
    <div class="grid-4">
      ${statCard('Active Staff', active.length, 'members', 'var(--accent-hi)')}
      ${statCard('Pending Leave', pendingLeave.length, 'requests', pendingLeave.length>0?'var(--orange)':'var(--green)')}
      ${statCard('Doc Alerts', licExpiring.length+pdpExpiring.length, 'expiring', licExpiring.length+pdpExpiring.length>0?'var(--red)':'var(--green)')}
      ${statCard('Departments', Object.keys(deptCounts).length, 'active', 'var(--sky)')}
    </div>
    ${(licExpiring.length||pdpExpiring.length)?`<div class="card" style="border-color:color-mix(in srgb,var(--red) 40%,var(--border));background:color-mix(in srgb,var(--red) 5%,var(--dark-mid))"><div class="card-title" style="color:var(--red)">&#8855; Document Expiry Alerts</div>${[...licExpiring.map(s=>`<div style="display:flex;justify-content:space-between;padding:6px 10px;background:color-mix(in srgb,var(--red) 8%,transparent);border-radius:var(--r);margin-bottom:4px"><span style="font-size:13px;color:var(--text);font-weight:600">${escHtml(s.name)} — Licence</span><span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--red)">Exp: ${fmtDate(s.license_expiry)}</span></div>`), ...pdpExpiring.map(s=>`<div style="display:flex;justify-content:space-between;padding:6px 10px;background:color-mix(in srgb,var(--orange) 8%,transparent);border-radius:var(--r);margin-bottom:4px"><span style="font-size:13px;color:var(--text);font-weight:600">${escHtml(s.name)} — PDP</span><span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--orange)">Exp: ${fmtDate(s.pdp_expiry)}</span></div>`)].join('')}</div>`:''}
    <div class="filter-row" style="flex-wrap:wrap">
      <button class="filter-btn ${filter==='all'?'active':''}" onclick="setStaffFilter('all')">ALL (${active.length})</button>
      ${DEPTS.filter(d=>deptCounts[d]).map(d=>`<button class="filter-btn ${filter===d?'active':''}" onclick="setStaffFilter('${d}')">${d.toUpperCase()} (${deptCounts[d]})</button>`).join('')}
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px">
      ${filtered.length ? filtered.map(s => {
        const initials = (s.name||'?').split(' ').map(n=>n[0]).join('').slice(0,2).toUpperCase();
        const pendL = (state.leaveRequests||[]).filter(l=>l.staff_id===s.id&&l.status==='pending').length;
        const pct = Math.round((['surname','date_of_birth','id_number','phone','emergency_contact_name','bank_account','allergies','residential_address'].filter(f=>s[f]).length/8)*100);
        return `
        <div class="card" style="cursor:pointer" onclick="openEditStaff(${s.id})">
          <div style="display:flex;align-items:flex-start;gap:12px">
            <div style="width:42px;height:42px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:var(--dark);flex-shrink:0">${initials}</div>
            <div style="flex:1;min-width:0">
              <div style="font-size:14px;font-weight:700;color:var(--text)">${escHtml(s.name+(s.surname?' '+s.surname:''))}</div>
              <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent)">${escHtml(s.role||'—')}</div>
              <div style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap">
                ${s.department?`<span>${escHtml(s.department)}</span>`:''}
                ${s.work_cycle?`<span>${escHtml(s.work_cycle)}</span>`:''}
                ${s.phone?`<span>&#128222; ${escHtml(s.phone)}</span>`:''}
              </div>
              <div style="margin-top:6px;display:flex;align-items:center;gap:8px">
                <div style="flex:1;background:var(--surface-hi);border-radius:2px;height:3px"><div style="height:100%;width:${pct}%;background:${pct<50?'var(--red)':pct<80?'var(--orange)':'var(--green)'};border-radius:2px"></div></div>
                <span style="font-family:'JetBrains Mono',monospace;font-size:9px;color:${pct<50?'var(--red)':'var(--text-muted)'}">${pct}%</span>
              </div>
              ${pendL>0?`<div style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--orange);margin-top:3px">&#9650; ${pendL} pending leave</div>`:''}
            </div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
              <span style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--green);background:color-mix(in srgb,var(--green) 15%,transparent);padding:2px 6px;border-radius:3px">ACTIVE</span>
              <button onclick="event.stopPropagation();openLeaveRequest(${s.id})" class="btn btn-ghost" style="font-size:9px;padding:3px 7px">+ Leave</button>
              <button onclick="event.stopPropagation();openStaffFolder(${s.id})" class="btn btn-ghost" style="font-size:9px;padding:3px 7px">&#128193; Folder</button>
            </div>
          </div>
        </div>`;
      }).join('') : `<div class="empty card" style="grid-column:1/-1">No staff — click Add Staff Member</div>`}
    </div>
    ${inactive.length?`<div class="card"><div class="card-title" style="color:var(--text-muted)">Inactive (${inactive.length})</div><div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted)">${inactive.map(s=>escHtml(s.name)).join(', ')}</div></div>`:''}
  </div>`;
}

function buildLeaveCalendar() {
  const now      = new Date();
  const navYear  = state.calYear  !== undefined ? state.calYear  : now.getFullYear();
  const navMonth = state.calMonth !== undefined ? state.calMonth : now.getMonth();
  const calDept  = state.calDept  || 'all';

  const MONTHS = ['January','February','March','April','May','June','July',
                  'August','September','October','November','December'];
  const DEPTS  = ['Management','Butlers','Housekeeping','Kitchen','Guides',
                  'Farm','Spa','Maintenance','Security','Administration'];

  const daysInMonth = new Date(navYear, navMonth+1, 0).getDate();
  const mStart = `${navYear}-${String(navMonth+1).padStart(2,'0')}-01`;
  const mEnd   = `${navYear}-${String(navMonth+1).padStart(2,'0')}-${String(daysInMonth).padStart(2,'0')}`;

  // All active staff, filtered by dept tab
  const allActive = state.staff.filter(s => s.is_active !== false);
  const activeStaff = calDept === 'all' ? allActive
    : allActive.filter(s => s.department === calDept);

  // Leave in this month
  const monthLeave = (state.leaveRequests||[]).filter(l =>
    l.start_date <= mEnd && l.end_date >= mStart &&
    (l.status === 'approved' || l.status === 'pending')
  );
  const pendingLeave = (state.leaveRequests||[]).filter(l => l.status === 'pending');

  // Leave type colours and labels
  const LEAVE_COLORS = {
    annual:'#22c55e', sick:'#ef4444', family_responsibility:'#f97316',
    unpaid:'#6b7280', study:'#0ea5e9', absent:'#dc2626', other:'#d97706'
  };
  const LEAVE_LABELS = {
    annual:'Annual', sick:'Sick', family_responsibility:'Family Resp.',
    unpaid:'Unpaid', study:'Study', absent:'Absent', other:'Other'
  };

  // ── Work cycle day calculator ──────────────────────────────
  // Returns true if a date is an OFF day for this staff member's roster
  function isRosterOff(staff, dateStr) {
    if (!staff.work_cycle || !staff.leave_cycle_start) return false;
    const start = new Date(staff.leave_cycle_start);
    const date  = new Date(dateStr);
    const daysDiff = Math.floor((date - start) / (1000*60*60*24));

    if (staff.work_cycle === '3 weeks on / 1 week off') {
      // 28-day cycle: days 0-20 = on, days 21-27 = off
      const pos = ((daysDiff % 28) + 28) % 28;
      return pos >= 21;
    }
    if (staff.work_cycle === '6 weeks on / 2 weeks off') {
      // 56-day cycle: days 0-41 = on, days 42-55 = off
      const pos = ((daysDiff % 56) + 56) % 56;
      return pos >= 42;
    }
    return false;
  }

  return `
  <div class="col-gap">
    <!-- Header -->
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
      <div class="section-title" style="margin-bottom:0">
        <div class="section-sub">— Staff Roster</div>
        <div class="section-h">${MONTHS[navMonth]} ${navYear}</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <button class="btn btn-ghost" style="padding:5px 10px" onclick="calNav(-1)">&#8592;</button>
        <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-sec);min-width:120px;text-align:center">${MONTHS[navMonth]} ${navYear}</span>
        <button class="btn btn-ghost" style="padding:5px 10px" onclick="calNav(1)">&#8594;</button>
        <button class="btn btn-ghost" onclick="calNav(0)">Today</button>
        <button class="btn btn-ghost" onclick="setStaffView('register')">&#8592; Register</button>
        <button class="btn btn-primary" onclick="openLeaveRequest(null)">+ Log Leave</button>
      </div>
    </div>

    <!-- Stats -->
    <div class="grid-4">
      ${statCard('On Leave', monthLeave.filter(l=>l.status==='approved').length, 'approved this month', 'var(--orange)')}
      ${statCard('Pending', pendingLeave.length, 'requests', pendingLeave.length>0?'var(--red)':'var(--green)')}
      ${statCard('Showing', activeStaff.length, calDept==='all'?'all staff':calDept, 'var(--accent-hi)')}
      ${statCard('Leave Days', monthLeave.filter(l=>l.status==='approved').reduce((s,l)=>s+Number(l.days_requested||0),0).toFixed(0), 'total this month', 'var(--savanna)')}
    </div>

    <!-- Pending approvals -->
    ${pendingLeave.length ? `
    <div class="card" style="border-color:color-mix(in srgb,var(--orange) 40%,var(--border));background:color-mix(in srgb,var(--orange) 5%,transparent)">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
        <div>
          <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--orange);margin-bottom:6px">&#9650; ${pendingLeave.length} LEAVE REQUEST${pendingLeave.length!==1?'S':''} PENDING APPROVAL</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            ${pendingLeave.map(l=>`
            <div style="background:var(--surface);border-radius:var(--r);padding:5px 10px;border:1px solid var(--border)">
              <div style="font-size:12px;font-weight:700;color:var(--text)">${escHtml(l.staff_name||'?')}</div>
              <div style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted)">${LEAVE_LABELS[l.leave_type]||l.leave_type} · ${fmtDate(l.start_date)} → ${fmtDate(l.end_date)} (${l.days_requested} days)</div>
            </div>`).join('')}
          </div>
        </div>
        <button class="btn btn-ghost" onclick="setStaffView('leave')">Review</button>
      </div>
    </div>` : ''}

    <!-- Department filter tabs -->
    <div class="filter-row" style="flex-wrap:wrap">
      <button class="filter-btn ${calDept==='all'?'active':''}" onclick="setCalDept('all')">ALL (${allActive.length})</button>
      ${DEPTS.filter(d => allActive.some(s=>s.department===d)).map(d => {
        const n = allActive.filter(s=>s.department===d).length;
        return `<button class="filter-btn ${calDept===d?'active':''}" onclick="setCalDept('${d}')">${d.toUpperCase()} (${n})</button>`;
      }).join('')}
    </div>

    <!-- Legend -->
    <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center">
      <span style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted)">LEAVE:</span>
      ${Object.entries(LEAVE_LABELS).map(([k,v])=>`
        <div style="display:flex;align-items:center;gap:4px">
          <div style="width:10px;height:10px;border-radius:2px;background:${LEAVE_COLORS[k]}"></div>
          <span style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted)">${v}</span>
        </div>`).join('')}
      <span style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted);margin-left:8px">ROSTER:</span>
      <div style="display:flex;align-items:center;gap:4px">
        <div style="width:10px;height:10px;border-radius:2px;background:color-mix(in srgb,var(--border) 60%,transparent)"></div>
        <span style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted)">Off duty</span>
      </div>
      <div style="display:flex;align-items:center;gap:4px">
        <div style="width:10px;height:10px;border-radius:2px;background:transparent;border:2px dashed #6b7280"></div>
        <span style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted)">Pending</span>
      </div>
    </div>

    <!-- Calendar grid -->
    <div class="card" style="padding:0;overflow:hidden">
      <div style="overflow-x:auto">
        <table style="width:100%;border-collapse:collapse;min-width:800px">
          <thead>
            <tr style="background:var(--surface)">
              <th style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted);padding:8px 12px;text-align:left;border-bottom:2px solid var(--border);min-width:170px;position:sticky;left:0;background:var(--surface);z-index:2">STAFF</th>
              <th style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted);padding:8px 8px;text-align:left;border-bottom:2px solid var(--border);min-width:80px">LEAVE LEFT</th>
              ${Array.from({length:daysInMonth},(_,i)=>{
                const d = i+1;
                const date = new Date(navYear, navMonth, d);
                const isToday = navYear===now.getFullYear()&&navMonth===now.getMonth()&&d===now.getDate();
                const dayNames = ['Su','Mo','Tu','We','Th','Fr','Sa'];
                const isWeekend = date.getDay()===0||date.getDay()===6;
                const isTuesday = date.getDay()===2;
                return `<th style="font-family:'JetBrains Mono',monospace;font-size:8px;padding:3px 1px;text-align:center;border-bottom:2px solid var(--border);min-width:26px;color:${isToday?'var(--accent)':isTuesday?'var(--savanna)':'var(--text-muted)'};background:${isToday?'color-mix(in srgb,var(--accent) 10%,transparent)':isTuesday?'color-mix(in srgb,var(--savanna) 8%,transparent)':'transparent'}">
                  <div style="font-weight:${isToday?'800':'400'}">${d}</div>
                  <div style="font-size:7px;opacity:0.6">${dayNames[date.getDay()]}</div>
                </th>`;
              }).join('')}
            </tr>
          </thead>
          <tbody>
            ${activeStaff.map(s => {
              const staffLeave  = monthLeave.filter(l => l.staff_id === s.id);
              const leaveUsed   = Number(s.leave_days_accumulated||0);
              const leaveTotal  = Number(s.annual_leave_days||15);
              const leaveLeft   = Math.max(0, leaveTotal - leaveUsed);
              const hasCycle    = s.work_cycle && s.leave_cycle_start &&
                                  ['3 weeks on / 1 week off','6 weeks on / 2 weeks off'].includes(s.work_cycle);

              return `
              <tr style="border-bottom:1px solid color-mix(in srgb,var(--border) 40%,transparent)">
                <td style="padding:5px 10px;position:sticky;left:0;background:var(--dark-mid);z-index:1;white-space:nowrap">
                  <div style="font-size:12px;font-weight:700;color:var(--text)">${escHtml(s.preferred_name||s.name)}</div>
                  <div style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted)">${escHtml(s.department||'—')}${s.work_cycle?' · '+escHtml(s.work_cycle):''}</div>
                </td>
                <td style="padding:5px 8px">
                  <div style="font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;color:${leaveLeft<=3?'var(--red)':'var(--green)'}">${leaveLeft}d</div>
                  <div style="width:55px;height:3px;background:var(--surface-hi);border-radius:2px;margin-top:2px">
                    <div style="height:100%;width:${Math.min((leaveLeft/leaveTotal)*100,100)}%;background:${leaveLeft<=3?'var(--red)':'var(--green)'};border-radius:2px"></div>
                  </div>
                </td>
                ${Array.from({length:daysInMonth},(_,i) => {
                  const day    = i+1;
                  const dayStr = `${navYear}-${String(navMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
                  const date   = new Date(navYear, navMonth, day);
                  const isToday = navYear===now.getFullYear()&&navMonth===now.getMonth()&&day===now.getDate();
                  const offDuty = hasCycle && isRosterOff(s, dayStr);
                  const leave   = staffLeave.find(l => l.start_date<=dayStr&&l.end_date>=dayStr);

                  let cellBg = isToday ? 'color-mix(in srgb,var(--accent) 8%,transparent)' : 'transparent';
                  let inner  = '';

                  if (leave) {
                    const col    = LEAVE_COLORS[leave.leave_type] || '#d97706';
                    const isPend = leave.status === 'pending';
                    inner = `<div style="width:22px;height:22px;border-radius:3px;background:${isPend?'transparent':col};border:${isPend?`2px dashed ${col}`:'none'};margin:0 auto" title="${escHtml(LEAVE_LABELS[leave.leave_type]||leave.leave_type)} (${leave.status})"></div>`;
                  } else if (offDuty) {
                    // Off duty on roster — grey striped
                    inner = `<div style="width:22px;height:22px;border-radius:3px;background:color-mix(in srgb,var(--border) 70%,transparent);margin:0 auto" title="Off duty (roster)"></div>`;
                    cellBg = 'color-mix(in srgb,var(--border) 20%,transparent)';
                  }

                  return `<td style="padding:2px;background:${cellBg}">${inner}</td>`;
                }).join('')}
              </tr>`;
            }).join('')}
            ${activeStaff.length === 0 ? `<tr><td colspan="${daysInMonth+2}" style="padding:20px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-muted)">No staff in this department</td></tr>` : ''}
          </tbody>
        </table>
      </div>
    </div>

    <!-- Leave balance summary cards -->
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px">
      ${activeStaff.map(s => {
        const leaveUsed  = Number(s.leave_days_accumulated||0);
        const leaveTotal = Number(s.annual_leave_days||15);
        const leaveLeft  = Math.max(0, leaveTotal - leaveUsed);
        const pending    = (state.leaveRequests||[]).filter(l=>l.staff_id===s.id&&l.status==='pending').length;
        return `
        <div style="padding:10px 12px;background:var(--surface);border-radius:var(--r);border:1px solid var(--border);cursor:pointer" onclick="openLeaveRequest(${s.id})">
          <div style="font-size:12px;font-weight:700;color:var(--text)">${escHtml(s.preferred_name||s.name)}</div>
          <div style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted);margin-bottom:6px">${escHtml(s.department||'—')}</div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
            <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted)">Annual leave</span>
            <span style="font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;color:${leaveLeft<=3?'var(--red)':'var(--green)'}">${leaveLeft} / ${leaveTotal} days left</span>
          </div>
          <div style="width:100%;height:4px;background:var(--surface-hi);border-radius:2px">
            <div style="height:100%;width:${Math.min((leaveUsed/leaveTotal)*100,100)}%;background:${leaveLeft<=3?'var(--red)':'var(--savanna)'};border-radius:2px"></div>
          </div>
          ${s.work_cycle ? `<div style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--sky);margin-top:5px">Roster: ${escHtml(s.work_cycle)}</div>` : ''}
          ${pending>0?`<div style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--orange);margin-top:3px">&#9650; ${pending} pending leave request${pending!==1?'s':''}</div>`:''}
        </div>`;
      }).join('')}
    </div>
  </div>`;
}


function buildLeaveManagement() {

  const all = state.leaveRequests||[];
  return `
  <div class="col-gap">

        <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent);letter-spacing:1px;margin-bottom:12px">MANAGEMENT COMPLETES</div>

function buildFuelLogModal() {
  const VEHICLE_TYPES = ['4x4 / Game Viewer','Bakkie / LDV','Generator','Tractor','TLB / Loader','Golf Cart','Quad bike / ATV','Water Pump'];
  const vehicles = state.assets.filter(a => VEHICLE_TYPES.includes(a.asset_type) || a.category === 'high_value');
  const selAssetId = state.selectedFuelAsset;
  const selAreaId  = state.selectedFuelArea;
  const selAsset   = vehicles.find(a => a.id === selAssetId);
  const selArea    = state.fuelAreas.find(a => a.id === selAreaId);
  const isHrs = selAsset && (selAsset.tracking_unit==='hrs'||['Generator','Tractor','TLB / Loader','Water Pump'].includes(selAsset.asset_type));
  const unitLabel = isHrs ? 'Hour Reading' : 'Odometer (km)';
  const lastReading = selAsset ? Number(selAsset.current_reading||0) : 0;
  return `
  <div class="modal-overlay" onclick="if(event.target===this)closeModal('fuelLog')">
    <div class="modal" style="width:520px">
      <div class="modal-title">&#9670; Issue Fuel</div>
      <div class="form-group"><label class="form-label">Vehicle / Machine *</label>
        <select class="form-select" id="fl-asset" onchange="updateFuelUnit(this.value)">
          <option value="">— Select —</option>
          ${vehicles.map(a=>{const u=(a.tracking_unit==='hrs'||['Generator','Tractor','TLB / Loader','Water Pump'].includes(a.asset_type))?'hrs':'km';return`<option value="${a.id}" ${a.id===selAssetId?'selected':''}>${escHtml(a.asset_name)} — ${Number(a.current_reading||0).toLocaleString()} ${u}</option>`;}).join('')}
        </select>
      </div>
      <div class="form-group"><label class="form-label">From Tank / Fuel Area *</label>
        <select class="form-select" id="fl-area" onchange="updateFuelAreaStock(this.value)">
          <option value="">— Select fuel source —</option>
          ${state.fuelAreas.map(a=>`<option value="${a.id}" ${a.id===selAreaId?'selected':''}>${escHtml(a.name)} — ${Number(a.current_litres).toFixed(0)} ${['lpgas'].includes(a.fuel_type)?'kg':'L'} (${a.fuel_type})</option>`).join('')}
        </select>
      </div>
      <div id="fl-area-stock" style="background:var(--surface);border-radius:var(--r);padding:8px 12px;margin-bottom:12px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted);${selArea?'':'display:none'}">
        ${selArea?`Available: <strong style="color:var(--orange)">${Number(selArea.current_litres).toFixed(0)} L</strong> in ${escHtml(selArea.name)}`:''}
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label" id="fl-start-label">${unitLabel} START *</label>
          <input class="form-input" id="fl-start" type="number" step="0.1" value="${lastReading||''}">
        </div>
        <div class="form-group"><label class="form-label" id="fl-end-label">${unitLabel} END *</label>
          <input class="form-input" id="fl-end" type="number" step="0.1" oninput="calcFuelStats()">
        </div>
        <div class="form-group"><label class="form-label">Litres *</label>
          <input class="form-input" id="fl-litres" type="number" step="0.1" placeholder="0.0" oninput="calcFuelStats()">
        </div>
      </div>
      <div style="background:var(--surface);border-radius:var(--r);padding:10px 14px;margin-bottom:12px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-sec)">
        Delta: <span id="fl-delta" style="color:var(--accent)">—</span> &nbsp;&nbsp;Rate: <span id="fl-rate" style="color:var(--savanna)">—</span> &nbsp;&nbsp;<span id="fl-flag" style="color:var(--green)">—</span>
      </div>
      <div style="border-top:1px solid var(--border);padding-top:12px;margin-bottom:12px">
        <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted);letter-spacing:1px;margin-bottom:10px">ISSUED TO</div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">Type</label>
            <select class="form-select" id="fl-issued-type">
              <option value="staff">Staff Member</option>
              <option value="guest">Guest</option>
              <option value="operations">Operations</option>
            </select>
          </div>
          <div class="form-group" style="flex:2"><label class="form-label">Name</label>
            <input class="form-input" id="fl-issued-name" placeholder="Type name..." list="fl-staff-list">
            <datalist id="fl-staff-list">
              ${state.staff.filter(s=>s.is_active!==false).map(s=>`<option value="${escHtml(s.preferred_name||s.name+(s.surname?' '+s.surname:''))}">`).join('')}
            </datalist>
          </div>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Logged By</label><input class="form-input" id="fl-by" placeholder="Your name"></div>
        <div class="form-group"><label class="form-label">Date</label><input class="form-input" id="fl-date" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
      </div>
      <div class="form-group"><label class="form-label">Notes</label><input class="form-input" id="fl-notes" placeholder="Any issues..."></div>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:6px">
        <button class="btn btn-ghost" onclick="closeModal('fuelLog')">Cancel</button>
        <button class="btn btn-primary" onclick="submitFuelLog()">Issue & Log</button>
      </div>
    </div>
  </div>`;
}

function buildStockInModal() {
  const suppliers = state.suppliers || [];
  const items     = state.stockItems || [];
  const selSuppId = state.grnSupplierId || '';
  const selSupp   = suppliers.find(s => String(s.id) === String(selSuppId));

  // Previous orders from this supplier
  const prevOrders = selSuppId
    ? (state.stockMovements || [])
        .filter(m => String(m.supplier_id) === String(selSuppId) && m.movement_type === 'in')
        .sort((a,b) => new Date(b.movement_date||b.created_at) - new Date(a.movement_date||a.created_at))
    : [];
  // Group by invoice
  const invoiceMap = {};
  prevOrders.forEach(m => {
    const inv = m.invoice_ref || 'No ref';
    if (!invoiceMap[inv]) invoiceMap[inv] = { date: m.movement_date, lines: [], total: 0 };
    invoiceMap[inv].lines.push(m);
    invoiceMap[inv].total += Number(m.total_cost || 0);
  });
  const prevInvoices = Object.entries(invoiceMap).slice(0, 5);

  const UNITS = ['each','L','kg','g','ml','m','pair','pack','box','roll','bag','bottle','tin','drum'];

  return `
  <div class="modal-overlay" onclick="if(event.target===this)closeModal('stockIn')">
    <div class="modal" style="width:900px;max-width:98vw;max-height:95vh;display:flex;gap:0;padding:0;overflow:hidden">

      <!-- LEFT: Previous orders panel -->
      <div style="width:260px;min-width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden">
        <div style="padding:16px 14px 10px;border-bottom:1px solid var(--border)">
          <div style="font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--text-muted);margin-bottom:8px">SUPPLIER</div>
          <select class="form-select" id="si-supplier" onchange="grnSelectSupplier(this.value)" style="font-size:12px">
            <option value="">— Select supplier —</option>
            ${suppliers.map(s=>`<option value="${s.id}" ${String(s.id)===String(selSuppId)?'selected':''}>${escHtml(s.name)}</option>`).join('')}
          </select>
        </div>

        <div style="flex:1;overflow-y:auto;padding:10px 14px">
          ${selSuppId ? `
          <div style="font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--text-muted);margin-bottom:10px">PREVIOUS ORDERS</div>
          ${prevInvoices.length ? prevInvoices.map(([inv, data]) => `
            <div style="margin-bottom:10px;padding:8px 10px;background:var(--dark-mid);border-radius:var(--r);border:1px solid var(--border);cursor:pointer"
              onclick="grnLoadInvoice('${escHtml(inv)}')">
              <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent);margin-bottom:2px">${escHtml(inv)}</div>
              <div style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted);margin-bottom:4px">${fmtDate(data.date)}</div>
              ${data.lines.map(l=>`
                <div style="font-size:11px;color:var(--text-sec);display:flex;justify-content:space-between">
                  <span>${escHtml(l.stock_name||'Item')}</span>
                  <span style="font-family:'JetBrains Mono',monospace;font-size:10px">${Number(l.quantity).toFixed(1)} ${l.unit||''}</span>
