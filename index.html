<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manyoni Ridge — Operations</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dayjs/1.11.10/dayjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>

  :root {
    --soil: #8B6914; --savanna: #C4A35A; --grass: #7A9E4E;
    --sky: #5B8DB8; --dusk: #D4622A; --ember: #E8793A;
    --dark: #141210; --dark-mid: #1C1915; --dark-light: #252118;
    --surface: #2E2920; --surface-hi: #3A342A; --surface-top: #453E32;
    --border: #3D3628; --border-hi: #524A3A;
    --text: #EDE5CF; --text-sec: #9A8E72; --text-muted: #5C5444;
    --accent: #C4A35A; --accent-hi: #E8C86A;
    --green: #7A9E4E; --green-hi: #96C25E;
    --red: #B85A4A; --red-hi: #D46A58;
    --blue: #5B8DB8; --orange: #D4622A;
    --r: 6px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'Libre Baskerville', Georgia, serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── LAYOUT ── */
  .app { display: flex; height: 100vh; overflow: hidden; }

  .sidebar {
    width: 220px; min-width: 220px;
    background: var(--dark-mid);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    transition: width 0.25s;
  }
  .sidebar.collapsed { width: 56px; min-width: 56px; }

  .sidebar-logo {
    padding: 16px 14px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  .logo-mark {
    width: 30px; height: 30px; min-width: 30px;
    background: var(--accent);
    border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700; font-size: 14px;
    color: var(--dark);
  }
  .logo-text { overflow: hidden; }
  .logo-text .name { font-size: 12px; font-weight: 700; color: var(--text); white-space: nowrap; }
  .logo-text .sub { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text-muted); letter-spacing: 2px; text-transform: uppercase; }

  nav { flex: 1; padding: 10px 8px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }

  .nav-btn {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px;
    border-radius: var(--r); border: none;
    background: transparent; color: var(--text-muted);
    cursor: pointer; font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.5px;
    border-left: 3px solid transparent;
    transition: all 0.15s; white-space: nowrap; overflow: hidden;
    text-align: left; width: 100%;
  }
  .nav-btn:hover { background: var(--surface); color: var(--text-sec); }
  .nav-btn.active {
    background: color-mix(in srgb, var(--accent) 15%, transparent);
    color: var(--accent-hi);
    border-left-color: var(--accent);
  }
  .nav-icon { font-size: 15px; min-width: 18px; text-align: center; }

  .sidebar-footer {
    padding: 10px 14px 14px;
    border-top: 1px solid var(--border);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: var(--text-muted);
  }
  .status-dot {
    display: inline-block; width: 7px; height: 7px;
    border-radius: 50%; background: var(--green);
    box-shadow: 0 0 6px var(--green);
    margin-right: 6px;
  }

  /* ── MAIN ── */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  .topbar {
    padding: 12px 28px;
    border-bottom: 1px solid var(--border);
    background: var(--dark-mid);
    display: flex; justify-content: space-between; align-items: center;
    flex-shrink: 0;
  }
  .topbar-left { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 2px; color: var(--text-muted); }
  .topbar-right { display: flex; align-items: center; gap: 14px; }

  .alert-badge {
    display: flex; align-items: center; gap: 6px;
    font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-muted);
  }
  .alert-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--orange); box-shadow: 0 0 8px var(--orange); }

  .avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--surface-hi);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: var(--accent); font-weight: 700;
    cursor: pointer; font-family: 'JetBrains Mono', monospace;
  }

  .content { flex: 1; overflow-y: auto; padding: 28px 32px; }

  /* ── CARDS ── */
  .card {
    background: var(--dark-mid);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 18px 20px;
  }
  .card-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 2px;
    color: var(--text-muted); text-transform: uppercase;
    margin-bottom: 14px;
  }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .grid-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 12px; }
  .col-gap { display: flex; flex-direction: column; gap: 16px; }

  /* ── SECTION TITLE ── */
  .section-title { margin-bottom: 20px; }
  .section-sub { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 3px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 5px; }
  .section-h { font-size: 22px; font-weight: 700; color: var(--text); letter-spacing: -0.5px; }

  /* ── STAT BLOCK ── */
  .stat-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
  .stat-value { font-size: 26px; font-weight: 700; letter-spacing: -1px; }
  .stat-unit { font-size: 13px; font-weight: 400; color: var(--text-sec); margin-left: 4px; }

  /* ── BUTTONS ── */
  .btn {
    padding: 7px 16px; border-radius: var(--r); border: none;
    cursor: pointer; font-family: 'JetBrains Mono', monospace;
    font-size: 11px; font-weight: 500; letter-spacing: 0.5px;
    transition: all 0.15s;
  }
  .btn-primary { background: var(--accent); color: var(--dark); }
  .btn-primary:hover { background: var(--accent-hi); }
  .btn-ghost { background: transparent; color: var(--text-sec); border: 1px solid var(--border); }
  .btn-ghost:hover { border-color: var(--border-hi); color: var(--text); }
  .btn-danger { background: var(--red); color: var(--text); }

  /* ── FILTER TABS ── */
  .filter-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .filter-btn {
    padding: 5px 13px; border-radius: 4px; border: 1px solid var(--border);
    background: transparent; color: var(--text-sec);
    cursor: pointer; font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
    transition: all 0.15s;
  }
  .filter-btn.active { background: var(--accent); color: var(--dark); border-color: var(--accent); }

  /* ── BADGES ── */
  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px; border-radius: 3px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; letter-spacing: 1px; text-transform: uppercase;
    border: 1px solid;
  }

  /* ── PRIORITY DOT ── */
  .p-dot {
    display: inline-block; width: 7px; height: 7px;
    border-radius: 50%; flex-shrink: 0;
  }

  /* ── TASK ROW ── */
  .task-row {
    padding: 12px 14px;
    background: var(--surface);
    border-radius: var(--r);
    border: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 12px; cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .task-row:hover { border-color: var(--border-hi); background: var(--surface-hi); }
  .task-title { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 5px; display: flex; align-items: center; gap: 8px; }
  .task-meta { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-muted); display: flex; gap: 14px; flex-wrap: wrap; }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.75);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000; backdrop-filter: blur(3px);
  }
  .modal {
    background: var(--dark-mid);
    border: 1px solid var(--border-hi);
    border-radius: 8px;
    padding: 28px;
    width: 560px; max-width: 95vw;
    max-height: 90vh; overflow-y: auto;
  }
  .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; color: var(--accent); }

  /* ── FORM ── */
  .form-group { margin-bottom: 14px; }
  .form-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 5px; display: block; }
  .form-input, .form-select, .form-textarea {
    width: 100%; padding: 9px 12px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r); color: var(--text);
    font-family: 'Libre Baskerville', serif; font-size: 13px;
    transition: border-color 0.15s; outline: none;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); }
  .form-select { cursor: pointer; }
  .form-select option { background: var(--surface); }
  .form-textarea { resize: vertical; min-height: 80px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* ── ALERT BANNER ── */
  .alert-banner {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-radius: var(--r);
    margin-bottom: 8px;
    border-left: 3px solid;
    font-size: 13px;
  }
  .alert-icon { font-size: 15px; flex-shrink: 0; }

  /* ── LOADING ── */
  .loading {
    display: flex; align-items: center; justify-content: center;
    padding: 40px; color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    letter-spacing: 2px;
    flex-direction: column; gap: 14px;
  }
  .spinner {
    width: 24px; height: 24px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── EMPTY STATE ── */
  .empty {
    padding: 40px; text-align: center;
    color: var(--text-muted); font-family: 'JetBrains Mono', monospace;
    font-size: 12px; letter-spacing: 1px;
  }

  /* ── TOAST ── */
  .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 2000; display: flex; flex-direction: column; gap: 8px; }
  .toast {
    padding: 12px 18px; border-radius: var(--r);
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    animation: slideIn 0.3s ease; min-width: 260px;
    border: 1px solid;
  }
  .toast.success { background: color-mix(in srgb, var(--green) 15%, var(--dark-mid)); border-color: var(--green); color: var(--green-hi); }
  .toast.error { background: color-mix(in srgb, var(--red) 15%, var(--dark-mid)); border-color: var(--red); color: var(--red-hi); }
  .toast.info { background: color-mix(in srgb, var(--blue) 15%, var(--dark-mid)); border-color: var(--blue); color: var(--sky); }
  @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

  /* ── LOG ROW ── */
  .log-row {
    padding: 10px 14px; background: var(--surface);
    border-radius: var(--r); border: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px;
  }
  .log-meta { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-muted); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: var(--dark); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* Dashboard welcome */
  .welcome-bar { margin-bottom: 22px; }
  .welcome-sub { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 3px; color: var(--text-muted); margin-bottom: 5px; }
  .welcome-h { font-size: 24px; font-weight: 700; color: var(--text); letter-spacing: -0.5px; }
  .welcome-date { font-size: 13px; color: var(--text-sec); margin-top: 3px; }

  /* Status colors via data attr */
  [data-status="operational"], [data-status="completed"], [data-status="verified"] { color: var(--green); }
  [data-status="in_progress"], [data-status="assigned"] { color: var(--sky); }
  [data-status="created"] { color: var(--text-muted); }
  [data-status="maintenance"], [data-status="medium"] { color: var(--orange); }
  [data-status="fault"], [data-status="high"] { color: var(--red); }
  [data-status="low"] { color: var(--green); }

  .setup-screen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100vh; gap: 20px; padding: 40px;
    background: var(--dark);
  }
  .setup-card {
    background: var(--dark-mid); border: 1px solid var(--border);
    border-radius: 8px; padding: 32px; max-width: 520px; width: 100%;
  }
  .setup-title { font-size: 20px; font-weight: 700; color: var(--accent); margin-bottom: 8px; }
  .setup-sub { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-muted); margin-bottom: 24px; }
  .setup-step { display: flex; gap: 12px; margin-bottom: 12px; font-size: 13px; color: var(--text-sec); }
  .step-num { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--dark); display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; flex-shrink: 0; }

  .divider { height: 1px; background: var(--border); margin: 16px 0; }

  .detail-panel {
    position: fixed; right: 0; top: 0; bottom: 0;
    width: 420px; background: var(--dark-mid);
    border-left: 1px solid var(--border-hi);
    z-index: 500; overflow-y: auto;
    padding: 24px;
    transform: translateX(100%);
    transition: transform 0.25s;
  }
  .detail-panel.open { transform: translateX(0); }
</style>
</head>

<script>
// ═══════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════
const SUPABASE_URL = 'https://piiqynherttfgrnlolcm.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBpaXF5bmhlcnR0ZmdybmxvbGNtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5MDM5ODQsImV4cCI6MjA4ODQ3OTk4NH0.ZVnilSkEPnyB6JFTktyctS3CZw0q0VTKACxWVQE0mNs';

// ── Supabase Auth Client ──────────────────────────────────────────────
const _supaAuth = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: {
    autoRefreshToken: true,
    persistSession: true,
    detectSessionInUrl: false,
  }
});

// ── Auth helpers ──────────────────────────────────────────────────────
async function signIn(email, password) {
  const { data, error } = await _supaAuth.auth.signInWithPassword({ email, password });
  if (error) throw error;
  return data;
}

async function signOut() {
  await _supaAuth.auth.signOut();
  state.session  = null;
  state.authUser = null;
  state.dbReady  = false;
  render();
}

async function getSession() {
  const { data: { session } } = await _supaAuth.auth.getSession();
  return session;
}

// Listen for auth changes
_supaAuth.auth.onAuthStateChange((event, session) => {
  state.session  = session;
  state.authUser = session?.user || null;
  if (event === 'SIGNED_OUT') {
    state.dbReady = false;
    render();
  }
});

// ═══════════════════════════════════════
// SUPABASE CLIENT
// ═══════════════════════════════════════
const sb = {
  async req(method, path, body) {
    // Use user JWT if logged in, otherwise fall back to anon key
    const session = state.session;
    const token = session?.access_token || SUPABASE_KEY;
    const headers = {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${token}`,
      'Content-Type': 'application/json',
    };
    if (method === 'POST') headers['Prefer'] = 'return=representation';
    if (method === 'PATCH') headers['Prefer'] = 'return=representation';

    const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      method,
      headers,
      body: body ? JSON.stringify(body) : undefined
    });

    if (!res.ok) {
      const err = await res.text();
      console.error('Supabase error:', method, path, err);
      throw new Error(err);
    }
    const text = await res.text();
    return text ? JSON.parse(text) : null;
  },
  get: (path) => sb.req('GET', path),
  post: (path, body) => sb.req('POST', path, body),
  patch: (path, body) => sb.req('PATCH', path, body),
  delete: (path) => sb.req('DELETE', path),
};

// ═══════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════

  'Kitchen Cold Store','Housekeeping Store','Office Store',
  'Spa & Gym Store','Fuel Store','Vehicle Store'
];

  'PPE & Uniform','Kitchen','Bar','Housekeeping',
  'Guest Amenities','Tools & Equipment','Stationery'
];

function storeLocationOpts(selected='') {
  const fromDB = state.storeLocations.map(s =>
    `<option value="${escHtml(s.name)}" ${s.name===selected?'selected':''}>${escHtml(s.name)}</option>`
  ).join('');
  return `<option value="">— Select location —</option>${fromDB}`;
}

// Helper — build stock type options
function stockTypeOpts(selected='') {
  const CAT_LABELS = {
    chemicals:'Chemicals',fuel:'Fuel',vehicle_generator_spares:'Vehicle & Generator Spares',
    electrical:'Electrical',plumbing:'Plumbing',paints_varnish:'Paints & Varnish',
    general_consumables:'General Consumables',ppe_uniform:'PPE & Uniform',
    kitchen:'Kitchen',bar:'Bar',housekeeping:'Housekeeping',
    guest_amenities:'Guest Amenities',tools_equipment:'Tools & Equipment',stationery:'Stationery'
  };
  return Object.entries(CAT_LABELS).map(([v,l]) =>
    `<option value="${v}" ${v===selected||l===selected?'selected':''}>${l}</option>`
  ).join('');
}

// ═══════════════════════════════════════
// STATE
// ═══════════════════════════════════════
const state = {
  page: 'dashboard',
  tasks: [], taskLogs: [], assets: [], ecoObs: [], chemicals: [],
  chemUsage: [], costEntries: [], stockItems: [], stockMovements: [], suppliers: [], assetLogs: [], costCentres: [], storeLocations: [], repairs: [],
  staff: [], fuelLogs: [], fuelAreas: [], fuelDeliveries: [], leaveRequests: [],
  showNewRepair: false, showNewStaff: false, assetSubView: 'assets', editingGovStockId: null, showFuelLog: false, showFuelDelivery: false, showFuelAreaSetup: false, showLeaveRequest: false,
  loading: false, dbReady: false, bootError: null,
  session: null, authUser: null, authError: null, loginEmail: '', loginPassword: '', loginLoading: false,
  grnSupplierId: null, stockView: 'stock', selectedSupplierTab: null,
  showNewTask: false, showNewAsset: false, showNewObs: false,
  showNewChem: false, showLogWork: false, showChemUse: false,
  showCostEntry: false, showStockItem: false, showStockIn: false,
  showStockOut: false, showOpCost: false, showStoreSetup: false,
  showGovStockUse: false, showNewGovStock: false, showStockAdjust: false,
  showCostCentres: false, showStocktake: false, showHsRisk: false,
  showHsContractor: false, showHsFirearm: false, showSupplier: false, showStocktake: false, showRecon: false,
  showAssetLog: false, showNewAsset: false,
  selectedTask: null, selectedChem: null, selectedStock: null, editingStockId: null, selectedAsset: null, editingAssetId: null, editingTaskId: null,
  editingStaffId: null, selectedFuelAsset: null, selectedFuelArea: null, selectedLeaveStaff: null,
  taskFilter: 'all', assetFilter: 'all', assetCatFilter: 'all', costCatFilter: '', stockCatFilter: 'all',
  stockSearch: '',
  staffFilter: 'all', staffView: 'register', fuelAssetFilter: 'all', calYear: null, calMonth: null, calDept: 'all',
  reconciliations: [], reconItems: [], viewingReconId: null,
  chartOfAccounts: [], propertyUnits: [], govStock: [], govStockUsage: [], staffDocuments: [],
  hsIncidents: [], hsChecklists: [], hsChecklistRuns: [], hsRisks: [], hsContractors: [], hsCertificates: [], hsFirearms: [],
  hsView: 'dashboard', showHsIncident: false, showHsCert: false, showHsRisk: false, showHsChecklistRun: false,
  showHsContractor: false, showHsFirearm: false, runningChecklist: null,
  showNewUnit: false, showGovStock: false, showGovStockUse: false, showNewGovStock: false,
  showStaffDoc: false, viewingStaffId: null,
  bootError: null,
  toasts: [],
};

// ═══════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════
function toast(msg, type = 'success') {
  const id = Date.now();
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

function priorityColor(p) {
  return p === 'high' ? 'var(--red)' : p === 'medium' ? 'var(--orange)' : 'var(--green)';
}
function statusColor(s) {
  const m = { operational:'var(--green)', completed:'var(--green)', verified:'var(--green-hi)',
    in_progress:'var(--sky)', assigned:'var(--blue)',
    created:'var(--text-muted)', maintenance:'var(--orange)', fault:'var(--red)' };
  return m[s] || 'var(--text-muted)';
}
function typeIcon(t) {
  const m = { maintenance:'⚙', conservation:'◈', inspection:'◫', repair:'△', survey:'◉', incident:'⊗' };
  return m[t] || '◈';
}
function fmtDate(d) { return d ? dayjs(d).format('DD MMM YYYY') : '—'; }
function escHtml(s) { if(s===null||s===undefined) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function fmtCurrency(n) { return 'R'+(Number(n)||0).toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtDateTime(d) { return d ? dayjs(d).format('D MMM, HH:mm') : '—'; }

async function initDB() {
  try {
    // Check session first
    const session = await getSession();
    if (!session) {
      state.bootError = 'Not authenticated';
      return false;
    }
    state.session  = session;
    state.authUser = session.user;
    await sb.get('tasks?limit=1');
    state.dbReady = true;
    state.bootError = null;
    return true;
  } catch(e) {
    console.error('initDB failed:', e.message);
    state.bootError = e.message;
    return false;
  }
}

async function createTables() {
  // Use Supabase SQL endpoint (RPC)
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/exec_sql`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ sql: SCHEMA })
    });
    return res.ok;
  } catch(e) { return false; }
}

// Receive stock: supplier tracked on movement record only. Current price = latest received price.
async function receiveStock(itemId, qty, unitCost, supplierId, invoiceRef, recordedBy, notes, recDate) {
  try {
    const item = state.stockItems.find(s => s.id === itemId);
    if (!item) { toast('Item not found', 'error'); return; }
    await sb.post('stock_movements', {
      stock_item_id: itemId, movement_type: 'in',
      quantity: qty, unit_cost: unitCost,
      supplier_id: supplierId || null,
      invoice_ref: invoiceRef || null,
      notes: notes || null,
      recorded_by: recordedBy || null,
      movement_date: new Date().toISOString().slice(0,10)
    });
    // Update stock level. New received price becomes current price.
    await sb.patch('stock_items?id=eq.'+itemId, {
      stock_level: Number(item.stock_level) + Number(qty),
      current_unit_cost: unitCost
    });
    // Stock received goes to Stock on Hand — only logged as cost when issued
    // We record the purchase as a stock-on-hand entry (source: stock_in) for reporting
    const sup = state.suppliers.find(s => s.id === supplierId);
    const costCat = {fuel:'fuel',vehicle_generator_spares:'equipment',electrical:'materials',plumbing:'materials',paints_varnish:'materials',general_consumables:'materials',chemicals:'chemicals'};
    await sb.post('cost_entries', {
      category: costCat[item.category] || 'materials',
      description: 'Stock IN: ' + item.name,
      quantity: qty, unit_cost: unitCost,
      supplier: sup ? sup.name : null,
      recorded_by: recordedBy || null,
      entry_date: recDate || new Date().toISOString().slice(0,10),
      source: 'stock_on_hand'
    });
    toast('Received ' + qty + ' ' + item.unit + ' of ' + item.name + ' — cost logged');
    await Promise.allSettled([loadStockItems(), loadStockMovements(), loadCostEntries()]);
  } catch(e) { let m=e.message; try{const p=JSON.parse(m);m=p.message||p.error||m;}catch(_){} toast('Error: '+m,'error'); }
}

// Issue stock: no supplier attribution. Cost calculated at current price.
async function issueStock(itemId, qty, taskId, recordedBy, notes) {
  try {
    const item = state.stockItems.find(s => s.id === itemId);
    if (!item) { toast('Item not found', 'error'); return; }
    if (Number(item.stock_level) < Number(qty)) {
      toast('Only ' + item.stock_level + ' ' + item.unit + ' in stock', 'error'); return;
    }
    const unitCost = Number(item.current_unit_cost || 0);
    await sb.post('stock_movements', {
      stock_item_id: itemId, movement_type: 'out',
      quantity: qty, unit_cost: unitCost,
      task_id: taskId || null,
      notes: notes || null,
      recorded_by: recordedBy || null,
      movement_date: new Date().toISOString().slice(0,10)
    });
    await sb.patch('stock_items?id=eq.'+itemId, {
      stock_level: Math.max(0, Number(item.stock_level) - Number(qty))
    });
    const costCat = {fuel:'fuel',vehicle_generator_spares:'equipment',electrical:'materials',plumbing:'materials',paints_varnish:'materials',general_consumables:'materials',chemicals:'chemicals'};
    await sb.post('cost_entries', {
      category: costCat[item.category] || 'materials',
      description: 'Stock OUT: ' + item.name,
      quantity: qty, unit_cost: unitCost,
      task_id: taskId || null,
      recorded_by: recordedBy || null,
      entry_date: new Date().toISOString().slice(0,10),
      source: 'stock_out'
    });
    toast('Issued ' + qty + ' ' + item.unit + ' at R' + unitCost + '/' + item.unit);
    await Promise.allSettled([loadStockItems(), loadStockMovements(), loadCostEntries()]);
  } catch(e) { let m=e.message; try{const p=JSON.parse(m);m=p.message||p.error||m;}catch(_){} toast('Error: '+m,'error'); }
}

function buildDashboard() {
  const now = new Date();
  const thisMonth = now.toISOString().slice(0,7);
  const todayStr  = now.toISOString().slice(0,10);

  // ── TASKS ──
  const openTasks     = state.tasks.filter(t => !['completed','archived','closed'].includes(t.status));
  const overdueTasks  = openTasks.filter(t => t.due_date && t.due_date < todayStr);
  const criticalTasks = openTasks.filter(t => t.priority === 'critical' || t.priority === 'high');
  const recentTasks   = state.tasks.slice(0,5);

  // ── COSTS THIS MONTH ──
  const monthCosts = state.costEntries.filter(e => (e.entry_date||'').slice(0,7) === thisMonth);
  // Stock on hand (stock_in) is NOT a cost — only issued stock, asset logs, and operational costs count
  const issuedCosts   = monthCosts.filter(e => e.source !== 'stock_on_hand' && e.source !== 'stock_in');
  const totalSpendMth = issuedCosts.reduce((s,e) => s + Number(e.total_cost||0), 0);

  // Cost breakdown by category this month
  const costByCat = {};
  issuedCosts.forEach(e => {
    const cat = e.category || 'other';
    costByCat[cat] = (costByCat[cat]||0) + Number(e.total_cost||0);
  });
  const catColors = {labour:'var(--green)',materials:'var(--savanna)',fuel:'var(--orange)',equipment:'var(--sky)',chemicals:'var(--red)',repairs:'var(--red)',services:'var(--blue)',other:'var(--text-muted)'};
  const topCats = Object.entries(costByCat).sort((a,b)=>b[1]-a[1]).slice(0,5);

  // ── STOCK ──
  const lowStock     = state.stockItems.filter(s => Number(s.minimum_level)>0 && Number(s.stock_level)<Number(s.minimum_level));
  const totalStockVal= state.stockItems.reduce((s,i) => s + Number(i.stock_level)*Number(i.current_unit_cost||0), 0);
  const stockBycat   = {};
  state.stockItems.forEach(s => { stockBycat[s.category] = (stockBycat[s.category]||0) + Number(s.stock_level)*Number(s.current_unit_cost||0); });

  // Recent stock movements this month
  const recentMoves = state.stockMovements.filter(m => (m.movement_date||'').slice(0,7) === thisMonth).slice(0,5);
  const monthStockIn  = state.stockMovements.filter(m => (m.movement_date||'').slice(0,7)===thisMonth && m.movement_type==='in').reduce((s,m)=>s+Number(m.total_cost||0),0);
  const monthStockOut = state.stockMovements.filter(m => (m.movement_date||'').slice(0,7)===thisMonth && m.movement_type==='out').reduce((s,m)=>s+Number(m.total_cost||0),0);

  // ── ASSETS ──
  const serviceDue   = state.assets.filter(a => {
    if (a.service_interval_type === 'reading' || !a.service_interval_type) {
      return a.next_service_due && Number(a.current_reading||0) >= Number(a.next_service_due) - Number(a.service_interval_unit||0)*0.1;
    } else {
      // Date-based service
      if (!a.next_service_date) return false;
      const due = new Date(a.next_service_date);
      const in30 = new Date(today); in30.setDate(in30.getDate()+30);
      return due <= in30;
    }
  });
  const faultAssets  = state.assets.filter(a => a.status === 'fault' || a.status === 'maintenance');
  const totalAssetVal= state.assets.reduce((s,a) => s + Number(a.current_value||a.purchase_value||0), 0);
  const in60 = new Date(now); in60.setDate(in60.getDate()+60);
  const warrantyExp  = state.assets.filter(a => a.warranty_expiry && new Date(a.warranty_expiry)>=now && new Date(a.warranty_expiry)<=in60);

  // ── ALERTS ──
  const alerts = [];
  criticalTasks.forEach(t => alerts.push({ level:'critical', icon:'⊗', text: 'Task: '+t.title, action: ()=>navigate('tasks') }));
  faultAssets.forEach(a  => alerts.push({ level:'critical', icon:'⊗', text: 'Asset fault: '+a.asset_name, action: ()=>navigate('assets') }));
  serviceDue.forEach(a   => alerts.push({ level:'high',     icon:'△', text: 'Service due: '+a.asset_name+' ('+a.current_reading+'/'+a.next_service_due+' '+a.tracking_unit+')', action: ()=>navigate('assets') }));
  overdueTasks.forEach(t => alerts.push({ level:'high',     icon:'△', text: 'Overdue: '+t.title, action: ()=>navigate('tasks') }));
  lowStock.forEach(s     => alerts.push({ level:'low',      icon:'◎', text: 'Low stock: '+s.name+' ('+s.stock_level+' '+s.unit+')', action: ()=>navigate('stock') }));
  warrantyExp.forEach(a  => alerts.push({ level:'medium',   icon:'◈', text: 'Warranty expiring: '+a.asset_name+' ('+fmtDate(a.warranty_expiry)+')', action: ()=>navigate('assets') }));
  const critAlerts = alerts.filter(a=>a.level==='critical');
  const highAlerts = alerts.filter(a=>a.level==='high');
  const otherAlerts= alerts.filter(a=>a.level!=='critical'&&a.level!=='high');

  const alertColor = lv => lv==='critical'?'var(--red)':lv==='high'?'var(--orange)':lv==='medium'?'var(--sky)':'var(--text-muted)';

  return `
  <div class="col-gap">
    <!-- Header -->
    <div class="welcome-bar">
      <div class="welcome-sub">Manyoni Ridge — Operations Centre</div>
      <div class="welcome-h">Operations Dashboard</div>
      <div class="welcome-date">${now.toLocaleDateString('en-ZA',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div>
    </div>

    ${(state.costCentres.length === 0 || state.storeLocations.length === 0 || state.chartOfAccounts.length === 0) ? `
    <div class="card" style="border-color:color-mix(in srgb,var(--accent) 40%,var(--border));background:color-mix(in srgb,var(--accent) 6%,var(--dark-mid))">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
        <div>
          <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent);letter-spacing:1px;margin-bottom:4px">FIRST TIME SETUP</div>
          <div style="font-size:13px;color:var(--text);font-weight:600">Setup required</div>
          <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted);margin-top:3px">
            ${state.costCentres.length===0?'Cost centres not created. ':''}${state.storeLocations.length===0?'Store locations not created.':''}
          </div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          ${state.costCentres.length===0?`<button class="btn btn-primary" onclick="seedCostCentres()">Create Cost Centres</button>`:''}
          ${state.chartOfAccounts.length===0?`<button class="btn btn-primary" onclick="seedChartOfAccounts()">Seed Chart of Accounts</button>`:''}
          ${state.storeLocations.length===0?`<button class="btn btn-primary" onclick="seedStoreLocations()">Create Store Locations</button>`:''}
        </div>
      </div>
    </div>` : ''}

    <!-- Critical alerts — always visible -->
    ${critAlerts.length || highAlerts.length ? `
    <div class="card" style="border-color:color-mix(in srgb,${critAlerts.length?'var(--red)':'var(--orange)'} 50%,var(--border));background:color-mix(in srgb,${critAlerts.length?'var(--red)':'var(--orange)'} 5%,var(--dark-mid));padding:12px 16px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
        <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:${critAlerts.length?'var(--red)':'var(--orange)'};letter-spacing:1px">${critAlerts.length?'⊗ CRITICAL ALERTS':'△ ATTENTION REQUIRED'}</span>
        <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted)">${critAlerts.length+highAlerts.length} item${critAlerts.length+highAlerts.length!==1?'s':''}</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        ${[...critAlerts,...highAlerts].map(a=>`
          <div style="display:flex;align-items:center;gap:10px;padding:7px 10px;background:color-mix(in srgb,${alertColor(a.level)} 8%,transparent);border-radius:var(--r);border-left:3px solid ${alertColor(a.level)};cursor:pointer" onclick="navigate('${a.level==='critical'&&a.text.includes('Asset')?'assets':a.level==='critical'?'tasks':a.text.includes('Overdue')?'tasks':'assets'}')">
            <span style="color:${alertColor(a.level)};font-size:14px">${a.icon}</span>
            <span style="font-size:12px;color:var(--text)">${escHtml(a.text)}</span>
          </div>`).join('')}
      </div>
    </div>` : `
    <div class="card" style="border-color:color-mix(in srgb,var(--green) 30%,var(--border));padding:10px 16px;display:flex;align-items:center;gap:10px">
      <span style="color:var(--green);font-size:16px">✓</span>
      <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--green)">ALL CLEAR — No critical alerts</span>
    </div>`}

    <!-- KPI row -->
    <div class="grid-4">
      ${statCard('Open Tasks', openTasks.length, 'active', openTasks.length>10?'var(--orange)':'var(--accent-hi)')}
      ${statCard('This Month', 'R'+totalSpendMth.toLocaleString('en-ZA',{maximumFractionDigits:0}), 'spent', 'var(--savanna)')}
      ${statCard('Stock Value', 'R'+totalStockVal.toLocaleString('en-ZA',{maximumFractionDigits:0}), 'on hand', 'var(--sky)')}
      ${statCard('Asset Value', 'R'+totalAssetVal.toLocaleString('en-ZA',{maximumFractionDigits:0}), 'total', 'var(--green)')}
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">

      <!-- Cost breakdown this month -->
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <div class="card-title" style="margin:0">◈ Costs — ${now.toLocaleDateString('en-ZA',{month:'long',year:'numeric'})}</div>
          <button class="btn btn-ghost" style="font-size:10px;padding:3px 8px" onclick="navigate('costs')">View all</button>
        </div>
        ${topCats.length ? `
        <div style="display:flex;flex-direction:column;gap:6px">
          ${topCats.map(([cat,amt])=>{
            const pct = totalSpendMth > 0 ? (amt/totalSpendMth*100) : 0;
            const col = catColors[cat]||'var(--text-muted)';
            return `

                <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-sec)">${cat.toUpperCase()}</span>
                <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--savanna)">R${amt.toLocaleString('en-ZA',{maximumFractionDigits:0})}</span>

              <div style="height:4px;background:var(--surface-hi);border-radius:2px">

          }).join('')}
          <div style="border-top:1px solid var(--border);margin-top:4px;padding-top:6px;display:flex;justify-content:space-between">
            <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted)">TOTAL</span>
            <span style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:var(--savanna)">R${totalSpendMth.toLocaleString('en-ZA',{maximumFractionDigits:0})}</span>

      </div>

          <div class="card-title" style="margin:0">◱ Stock Summary</div>

            <div style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted);margin-bottom:2px">RECEIVED THIS MONTH</div>
            <div style="font-size:15px;font-weight:700;color:var(--green)">R${monthStockIn.toLocaleString('en-ZA',{maximumFractionDigits:0})}</div>
          </div>
          <div style="background:var(--surface);border-radius:var(--r);padding:8px 10px">
            <div style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted);margin-bottom:2px">ISSUED THIS MONTH</div>
            <div style="font-size:15px;font-weight:700;color:var(--orange)">R${monthStockOut.toLocaleString('en-ZA',{maximumFractionDigits:0})}</div>
          </div>
        </div>
        ${lowStock.length ? `
        <div style="margin-bottom:8px">
          <div style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--red);letter-spacing:1px;margin-bottom:6px">⊗ LOW STOCK (${lowStock.length})</div>
          ${lowStock.slice(0,4).map(s=>`
            <div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid color-mix(in srgb,var(--border) 50%,transparent)">
              <span style="font-size:12px;color:var(--text)">${escHtml(s.name)}</span>
              <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--red)">${s.stock_level} ${s.unit} / min ${s.minimum_level}</span>
            </div>`).join('')}
          ${lowStock.length>4?`<div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted);margin-top:4px">+${lowStock.length-4} more</div>`:''}
        </div>` : `<div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--green);margin-bottom:8px">✓ All stock above minimum levels</div>`}
        <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted)">
          ${state.stockItems.length} items &nbsp;·&nbsp; ${state.suppliers.length} suppliers
        </div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">

      <!-- Open tasks -->
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <div class="card-title" style="margin:0">◫ Open Tasks</div>
          <button class="btn btn-ghost" style="font-size:10px;padding:3px 8px" onclick="navigate('tasks')">View all</button>
        </div>
        ${openTasks.length ? openTasks.slice(0,6).map(t=>`
          <div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid color-mix(in srgb,var(--border) 50%,transparent);cursor:pointer" onclick="navigate('tasks')">
            <div style="display:flex;align-items:center;gap:8px;min-width:0">
              <span style="width:6px;height:6px;border-radius:50%;background:${priorityColor(t.priority)};flex-shrink:0;box-shadow:0 0 4px ${priorityColor(t.priority)}80"></span>
              <div style="min-width:0">
                <div style="font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px">${escHtml(t.title)}</div>
                <div style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted)">${t.type||'—'} ${t.due_date&&t.due_date<todayStr?'· <span style="color:var(--red)">OVERDUE</span>':''}</div>
              </div>
            </div>
            <span style="font-family:'JetBrains Mono',monospace;font-size:9px;color:${statusColor(t.status)};background:color-mix(in srgb,${statusColor(t.status)} 15%,transparent);padding:2px 6px;border-radius:3px;white-space:nowrap;flex-shrink:0">${(t.status||'').replace(/_/g,' ')}</span>
          </div>`).join('') : '<div class="empty" style="padding:12px 0">No open tasks</div>'}
        ${openTasks.length>6?`<div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted);margin-top:6px">+${openTasks.length-6} more tasks</div>`:''}
      </div>

      <!-- Assets needing attention -->
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <div class="card-title" style="margin:0">◈ Asset Status</div>
          <button class="btn btn-ghost" style="font-size:10px;padding:3px 8px" onclick="navigate('assets')">View all</button>
        </div>
        ${[...faultAssets,...serviceDue,...warrantyExp].length ? `
        <div style="display:flex;flex-direction:column;gap:6px">
          ${faultAssets.map(a=>`
            <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 8px;background:color-mix(in srgb,var(--red) 8%,transparent);border-radius:var(--r);border-left:2px solid var(--red)">
              <span style="font-size:12px;color:var(--text);font-weight:600">${escHtml(a.asset_name)}</span>
              <span style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--red)">${(a.status||'').toUpperCase()}</span>
            </div>`).join('')}
          ${serviceDue.map(a=>`
            <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 8px;background:color-mix(in srgb,var(--orange) 8%,transparent);border-radius:var(--r);border-left:2px solid var(--orange)">
              <span style="font-size:12px;color:var(--text);font-weight:600">${escHtml(a.asset_name)}</span>
              <span style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--orange)">SERVICE DUE</span>
            </div>`).join('')}
          ${warrantyExp.map(a=>`
            <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 8px;background:color-mix(in srgb,var(--sky) 8%,transparent);border-radius:var(--r);border-left:2px solid var(--sky)">
              <span style="font-size:12px;color:var(--text);font-weight:600">${escHtml(a.asset_name)}</span>
              <span style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--sky)">WARRANTY ${fmtDate(a.warranty_expiry)}</span>
            </div>`).join('')}
        </div>` : `
        <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--green);margin-bottom:8px">✓ All assets operational</div>`}
        <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted);margin-top:8px">
          ${state.assets.length} registered &nbsp;·&nbsp; R${totalAssetVal.toLocaleString('en-ZA',{maximumFractionDigits:0})} total value
        </div>
      </div>
    </div>

    <!-- Other alerts (low/medium) -->
    ${otherAlerts.length ? `
    <div class="card">
      <div class="card-title">◎ Notifications</div>
      <div style="display:flex;flex-direction:column;gap:5px">
        ${otherAlerts.map(a=>`
          <div style="display:flex;align-items:center;gap:8px;padding:6px 10px;background:color-mix(in srgb,${alertColor(a.level)} 6%,transparent);border-radius:var(--r)">
            <span style="color:${alertColor(a.level)};font-size:12px">${a.icon}</span>
            <span style="font-size:12px;color:var(--text-sec)">${escHtml(a.text)}</span>
          </div>`).join('')}
      </div>
    </div>` : ''}

    <!-- Recent activity feed -->
    <div class="card">
      <div class="card-title">◰ Recent Activity</div>
      <div class="col-gap" style="gap:5px">
        ${[
          ...state.stockMovements.slice(0,3).map(m => {
            const item = state.stockItems.find(s=>s.id===m.stock_item_id);
            const isIn = m.movement_type==='in';
            return { date: m.created_at||m.movement_date, text: (isIn?'Stock received: ':'Stock issued: ')+(item?item.name:'item')+' — '+m.quantity+' '+(item?item.unit:''), icon: isIn?'◱':'◱', col: isIn?'var(--green)':'var(--orange)' };
          }),
          ...state.tasks.filter(t=>t.status==='completed').slice(0,2).map(t=>({
            date: t.created_at, text: 'Task completed: '+t.title, icon: '✓', col: 'var(--green)'
          })),
          ...state.assetLogs.slice(0,2).map(l => {
            const a = state.assets.find(x=>x.id===l.asset_id);
            return { date: l.created_at||l.log_date, text: 'Asset log: '+(a?a.asset_name:'asset')+' — '+l.log_type, icon: '◈', col: 'var(--sky)' };
          })
        ].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,8).map(item=>`
          <div class="log-row">
            <div style="display:flex;align-items:center;gap:8px">
              <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:${item.col}">${item.icon}</span>
              <span style="font-size:12px;color:var(--text-sec)">${escHtml(item.text)}</span>
            </div>
            <span class="log-meta">${fmtDate(item.date)}</span>
          </div>`).join('')}
        ${state.stockMovements.length===0&&state.tasks.length===0?'<div class="empty">No activity yet — start by adding stock items and tasks</div>':''}
      </div>
    </div>
  </div>`;
}


function statCard(label, value, unit, color) {
  return `<div class="card">
    <div class="stat-label">${label}</div>
    <div class="stat-value" style="color:${color}">${value}<span class="stat-unit">${unit}</span></div>
  </div>`;
}

// ═══════════════════════════════════════
// TASKS
// ═══════════════════════════════════════
function buildTasks() {
  const filters = ['all','created','assigned','in_progress','completed'];
  const filtered = state.taskFilter === 'all'
    ? state.tasks.filter(t => t.status !== 'completed' && t.status !== 'closed')
    : state.taskFilter === 'completed'
    ? state.tasks.filter(t => t.status === 'completed' || t.status === 'closed')
    : state.tasks.filter(t => t.status === state.taskFilter);

  return `
  <div class="col-gap">
    <div style="display:flex;justify-content:space-between;align-items:flex-end">
      <div class="section-title" style="margin-bottom:0">
        <div class="section-sub">— Operations</div>
        <div class="section-h">Task Management</div>
      </div>
      <button class="btn btn-primary" onclick="showModal('newTask')">+ New Task</button>
    </div>

    <div class="filter-row">
      ${filters.map(f => `<button class="filter-btn ${state.taskFilter===f?'active':''}" onclick="setFilter('task','${f}')">${f.replace(/_/g,' ').toUpperCase()}</button>`).join('')}
    </div>

    <div class="col-gap" style="gap:8px">
      ${filtered.length ? filtered.map(t => buildTaskRow(t)).join('') : '<div class="empty card">No tasks match this filter</div>'}
    </div>
  </div>`;
}

function buildTaskRow(t) {
  return `
  <div class="task-row" onclick="openTask(${t.id});navigate('tasks')">
    <div style="flex:1;min-width:0">
      <div class="task-title">
        <span class="p-dot" style="background:${priorityColor(t.priority)};box-shadow:0 0 5px ${priorityColor(t.priority)}80"></span>
        ${escHtml(t.title)}
      </div>
      <div class="task-meta">
        <span>${typeIcon(t.type)} ${t.type||''}</span>
        <span>◧ ${t.assigned_team||'Unassigned'}</span>
        ${t.map_feature ? `<span>⬡ ${escHtml(t.map_feature)}</span>` : ''}
        ${t.due_date ? `<span>Due ${fmtDate(t.due_date)}</span>` : ''}
      </div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0">
      <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:${statusColor(t.status)};background:color-mix(in srgb,${statusColor(t.status)} 15%,transparent);padding:3px 8px;border-radius:3px;border:1px solid color-mix(in srgb,${statusColor(t.status)} 30%,transparent)">${t.status.replace(/_/g,' ').toUpperCase()}</span>
      <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:${priorityColor(t.priority)}">${t.priority.toUpperCase()}</span>
    </div>
  </div>`;
}

// ═══════════════════════════════════════
// ASSETS
// ═══════════════════════════════════════
function buildAssets() {
  // Sub-view routing
  if (state.assetSubView === 'units')    return buildPropertyUnits();

  const CAT = {
    high_value: { label:'High Value Assets', color:'var(--accent-hi)', icon:'◈' },
    fire_fighting: { label:'Fire Fighting Assets', color:'var(--red)', icon:'◉' },
    conservation: { label:'Conservation Assets', color:'var(--green)', icon:'◎' },
    kitchen: { label:'Kitchen Assets', color:'var(--orange)', icon:'◎' },
    lodge: { label:'Lodge Assets', color:'var(--sky)', icon:'◧' },
    security: { label:'Security & Cameras', color:'var(--blue)', icon:'◉' },
    camera_equipment: { label:'Camera Equipment', color:'var(--savanna)', icon:'◈' },
    general_tools: { label:'General Assets & Tools', color:'var(--text-sec)', icon:'◧' }
  };
  const filter = state.assetCatFilter || 'all';
  const filtered = filter === 'all' ? state.assets : state.assets.filter(a => a.category === filter);

  // Service due — next_service_due <= current_reading + 10% of interval
  const serviceDue = state.assets.filter(a => {
    if (!a.next_service_due || !a.service_interval_unit) return false;
    const buffer = Number(a.service_interval_unit) * 0.1;
    return Number(a.current_reading||0) >= Number(a.next_service_due) - buffer;
  });
  // Warranty expiring within 60 days
  const today = new Date(); const in60 = new Date(today); in60.setDate(in60.getDate()+60);
  const warrantyAlert = state.assets.filter(a => {
    if (!a.warranty_expiry) return false;
    const exp = new Date(a.warranty_expiry);
    return exp >= today && exp <= in60;
  });
  const totalValue = state.assets.reduce((s,a) => s + Number(a.current_value||a.purchase_value||0), 0);
  const needsAttn = state.assets.filter(a => a.status === 'fault' || a.status === 'maintenance').length;

  return `
  <div class="col-gap">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px">
      <div class="section-title" style="margin-bottom:0">
        <div class="section-sub">— Fleet & Equipment</div>
        <div class="section-h">Asset Register</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-ghost" onclick="window.navigate('repairs')">&#9698; Off-site Repairs</button>
        <button class="btn btn-ghost" onclick="setAssetSubView('units')">&#9671; Rooms & Units</button>
        <button class="btn btn-primary" onclick="showModal('newAsset')">+ Register Asset</button>
      </div>
    </div>

    <div class="grid-4">
      ${statCard('Total Assets', state.assets.length, 'registered', 'var(--accent-hi)')}
      ${statCard('Total Value', 'R'+totalValue.toLocaleString('en-ZA',{maximumFractionDigits:0}), 'current', 'var(--savanna)')}
      ${statCard('Service Due', serviceDue.length, 'alerts', serviceDue.length > 0 ? 'var(--orange)' : 'var(--green)')}
      ${statCard('Needs Attention', needsAttn, 'assets', needsAttn > 0 ? 'var(--red)' : 'var(--green)')}
    </div>

    ${(serviceDue.length || warrantyAlert.length) ? `
    <div class="card" style="border-color:color-mix(in srgb,var(--orange) 40%,var(--border));background:color-mix(in srgb,var(--orange) 5%,var(--dark-mid))">
      <div class="card-title" style="color:var(--orange)">&#9888; Alerts</div>
      ${serviceDue.map(a => `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:7px 10px;background:color-mix(in srgb,var(--orange) 8%,transparent);border-radius:var(--r);margin-bottom:5px">
          <span style="font-size:13px;color:var(--text);font-weight:600">${escHtml(a.asset_name)}</span>
          <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--orange)">SERVICE DUE — ${a.current_reading} / ${a.next_service_due} ${a.tracking_unit}</span>
        </div>`).join('')}
      ${warrantyAlert.map(a => `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:7px 10px;background:color-mix(in srgb,var(--sky) 8%,transparent);border-radius:var(--r);margin-bottom:5px">
          <span style="font-size:13px;color:var(--text);font-weight:600">${escHtml(a.asset_name)}</span>
          <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--sky)">WARRANTY EXPIRES ${fmtDate(a.warranty_expiry)}</span>
        </div>`).join('')}
    </div>` : ''}

    <div class="filter-row">
      <button class="filter-btn ${filter==='all'?'active':''}" onclick="setAssetFilter('all')">ALL (${state.assets.length})</button>
      ${Object.entries(CAT).map(([k,v]) => {
        const n = state.assets.filter(a=>a.category===k).length;
        return `<button class="filter-btn ${filter===k?'active':''}" onclick="setAssetFilter('${k}')" style="color:${filter===k?'':v.color}">${v.icon} ${v.label.toUpperCase()} (${n})</button>`;
      }).join('')}
    </div>

    <div class="col-gap" style="gap:8px">
      ${filtered.length ? filtered.map(a => {
        const cat = CAT[a.category] || CAT.general_tools;
        const col = cat.color;
        const logs = (state.assetLogs||[]).filter(l => l.asset_id === a.id);
        const lastLog = logs[0];
        const isTracked = ['high_value','fire_fighting','conservation'].includes(a.category);
        const isHighValue = a.category === 'high_value';
        const svcDue = a.next_service_due && Number(a.current_reading||0) >= Number(a.next_service_due) - Number(a.service_interval_unit||0)*0.1;
        const faultFlag = a.status === 'fault' || a.status === 'maintenance';
        const depPct = (a.expected_life_years && a.purchase_date) ?
          Math.min(((new Date()-new Date(a.purchase_date))/(Number(a.expected_life_years)*365.25*24*3600*1000))*100,100) : null;
        const curVal = Number(a.current_value||a.purchase_value||0);
        const logCosts = logs.filter(l=>Number(l.cost||0)>0).reduce((s,l)=>s+Number(l.cost),0);

        return `
        <div class="card" style="${faultFlag?'border-color:color-mix(in srgb,var(--red) 40%,var(--border));':svcDue?'border-color:color-mix(in srgb,var(--orange) 40%,var(--border));':''}cursor:pointer" onclick="openAsset(${a.id})">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
            <div style="flex:1;min-width:0">
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px">
                <span style="font-family:'JetBrains Mono',monospace;font-size:9px;color:${col};background:color-mix(in srgb,${col} 15%,transparent);padding:2px 7px;border-radius:3px;border:1px solid color-mix(in srgb,${col} 25%,transparent)">${cat.label.toUpperCase()}</span>
                ${a.asset_type ? `<span style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted);background:var(--surface);padding:2px 6px;border-radius:3px">${escHtml(a.asset_type)}</span>` : ''}
                <span style="font-size:15px;font-weight:700;color:var(--text)">${escHtml(a.asset_name)}</span>
              </div>
              <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted);display:flex;gap:14px;flex-wrap:wrap">
                ${a.make_model ? `<span>${escHtml(a.make_model)}</span>` : ''}
                ${a.serial_number ? `<span>S/N: ${escHtml(a.serial_number)}</span>` : ''}
                ${curVal > 0 ? `<span style="color:var(--savanna)">Value: R${curVal.toLocaleString('en-ZA',{maximumFractionDigits:0})}</span>` : ''}
                ${logCosts > 0 ? `<span>Logged costs: R${logCosts.toLocaleString('en-ZA',{maximumFractionDigits:0})}</span>` : ''}
                ${a.warranty_expiry ? `<span style="color:${new Date(a.warranty_expiry)<today?'var(--red)':'var(--sky)'}">Warranty: ${fmtDate(a.warranty_expiry)}</span>` : ''}
                ${isTracked && a.current_reading ? `<span style="color:var(--accent)">${a.current_reading} ${a.tracking_unit}</span>` : ''}
                ${isTracked && a.last_service_date ? `<span>Last service: ${fmtDate(a.last_service_date)}</span>` : ''}
                ${a.storage_location ? `<span>&#128204; ${escHtml(a.storage_location)}</span>` : ''}
              </div>
              ${depPct !== null ? `
              <div style="margin-top:8px">
                <div style="display:flex;justify-content:space-between;margin-bottom:3px">
                  <span style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted)">ASSET LIFE</span>
                  <span style="font-family:'JetBrains Mono',monospace;font-size:9px;color:${depPct>80?'var(--red)':depPct>50?'var(--orange)':'var(--text-muted)'}">${depPct.toFixed(0)}% elapsed</span>
                </div>
                <div style="height:3px;background:var(--surface-hi);border-radius:2px">
                  <div style="height:100%;width:${depPct}%;background:${depPct>80?'var(--red)':depPct>50?'var(--orange)':'var(--green)'};border-radius:2px;transition:width 0.4s"></div>
                </div>
              </div>` : ''}
            </div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;margin-left:12px">
              <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:${statusColor(a.status)};background:color-mix(in srgb,${statusColor(a.status)} 15%,transparent);padding:3px 9px;border-radius:4px;border:1px solid color-mix(in srgb,${statusColor(a.status)} 30%,transparent);white-space:nowrap">${(a.status||'').toUpperCase()}</span>
              ${svcDue ? `<span style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--orange);background:color-mix(in srgb,var(--orange) 12%,transparent);padding:2px 7px;border-radius:3px">SERVICE DUE</span>` : ''}
            </div>
          </div>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            <button class="btn btn-ghost" style="font-size:10px;padding:4px 10px" onclick="event.stopPropagation();openAssetLog(${a.id})">+ Log Entry</button>
            <button class="btn btn-ghost" style="font-size:10px;padding:4px 10px" onclick="event.stopPropagation();openEditAsset(${a.id})">&#9998; Edit</button>
            ${lastLog ? `<span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted);padding:4px 0;margin-left:4px">Last: ${lastLog.log_type} — ${fmtDate(lastLog.log_date)}</span>` : ''}
          </div>
        </div>`;
      }).join('') : `<div class="empty card">No assets registered yet</div>`}
    </div>
  </div>`;
}

function buildAssetDetail() {
  const a = state.assets.find(x => x.id === state.selectedAsset);
  if (!a) return '';
  const logs = (state.assetLogs||[]).filter(l => l.asset_id === a.id);
  const CAT = {high_value:'High Value',fire_fighting:'Fire Fighting',conservation:'Conservation',general_tools:'General & Tools'};
  const LOG_COLORS = {service:'var(--green)',check:'var(--sky)',repair:'var(--red)',fuel:'var(--orange)',issue:'var(--red)',mileage:'var(--accent)',hours:'var(--accent)',maintenance:'var(--savanna)'};

  return `

      <button class="btn btn-ghost" style="font-size:11px" onclick="closeAsset()">&#8592; Back to Assets</button>

    <div class="card">

            ${a.make_model?`<span>${escHtml(a.make_model)}</span>`:''}
            ${a.serial_number?`<span>S/N: ${escHtml(a.serial_number)}</span>`:''}
            ${a.supplier?`<span>Supplier: ${escHtml(a.supplier)}</span>`:''}
          </div>
        </div>
        <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:${statusColor(a.status)};background:color-mix(in srgb,${statusColor(a.status)} 15%,transparent);padding:5px 12px;border-radius:4px;border:1px solid color-mix(in srgb,${statusColor(a.status)} 30%,transparent)">${(a.status||'').toUpperCase()}</span>
      </div>

      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:16px">
        ${a.purchase_value>0?`<div style="background:var(--surface);padding:10px;border-radius:var(--r)"><div style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted);margin-bottom:3px">PURCHASE VALUE</div><div style="font-size:16px;font-weight:700;color:var(--text)">R${Number(a.purchase_value).toLocaleString('en-ZA',{maximumFractionDigits:0})}</div></div>`:''}
        ${a.current_value>0?`<div style="background:var(--surface);padding:10px;border-radius:var(--r)"><div style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted);margin-bottom:3px">CURRENT VALUE</div><div style="font-size:16px;font-weight:700;color:var(--savanna)">R${Number(a.current_value).toLocaleString('en-ZA',{maximumFractionDigits:0})}</div></div>`:''}
        ${totalCost>0?`<div style="background:var(--surface);padding:10px;border-radius:var(--r)"><div style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted);margin-bottom:3px">TOTAL LOGGED COSTS</div><div style="font-size:16px;font-weight:700;color:var(--red)">R${totalCost.toLocaleString('en-ZA',{maximumFractionDigits:0})}</div></div>`:''}
        ${a.current_reading>0?`<div style="background:var(--surface);padding:10px;border-radius:var(--r)"><div style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted);margin-bottom:3px">CURRENT ${(a.tracking_unit||'').toUpperCase()}</div><div style="font-size:16px;font-weight:700;color:var(--accent)">${a.current_reading} ${a.tracking_unit}</div></div>`:''}
        ${a.next_service_due?`<div style="background:var(--surface);padding:10px;border-radius:var(--r)"><div style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted);margin-bottom:3px">NEXT SERVICE</div><div style="font-size:16px;font-weight:700;color:var(--orange)">${a.next_service_due} ${a.tracking_unit}</div></div>`:''}
        ${a.warranty_expiry?`<div style="background:var(--surface);padding:10px;border-radius:var(--r)"><div style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted);margin-bottom:3px">WARRANTY EXPIRES</div><div style="font-size:15px;font-weight:700;color:${new Date(a.warranty_expiry)<new Date()?'var(--red)':'var(--sky)'}">${fmtDate(a.warranty_expiry)}</div></div>`:''}
        ${a.purchase_date?`<div style="background:var(--surface);padding:10px;border-radius:var(--r)"><div style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted);margin-bottom:3px">PURCHASED</div><div style="font-size:14px;font-weight:700;color:var(--text)">${fmtDate(a.purchase_date)}</div></div>`:''}
        ${a.expected_life_years?`<div style="background:var(--surface);padding:10px;border-radius:var(--r)"><div style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted);margin-bottom:3px">EXPECTED LIFE</div><div style="font-size:14px;font-weight:700;color:var(--text)">${a.expected_life_years} years</div></div>`:''}
      </div>
      ${a.notes?`<div style="margin-top:12px;font-size:13px;color:var(--text-sec);border-top:1px solid var(--border);padding-top:10px">${escHtml(a.notes)}</div>`:''}
    </div>

    <div class="card">
      <div class="card-title">&#9670; Log History</div>
      ${logs.length ? `
      <div class="col-gap" style="gap:5px">
        ${logs.map(l => {
          const col = LOG_COLORS[l.log_type]||'var(--text-muted)';
          return `
          <div style="display:flex;justify-content:space-between;align-items:flex-start;padding:9px 12px;background:var(--surface);border-radius:var(--r);border:1px solid var(--border)">
            <div style="display:flex;align-items:flex-start;gap:10px">
              <span style="font-family:'JetBrains Mono',monospace;font-size:9px;color:${col};background:color-mix(in srgb,${col} 15%,transparent);padding:2px 7px;border-radius:3px;white-space:nowrap;margin-top:2px">${l.log_type.toUpperCase()}</span>
              <div>
                <div style="font-size:13px;color:var(--text)">${escHtml(l.description||'—')}</div>
                <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted);margin-top:2px;display:flex;gap:10px;flex-wrap:wrap">
                  ${l.done_by?`<span>${escHtml(l.done_by)}</span>`:''}
                  ${l.reading?`<span>${l.reading} ${a.tracking_unit}</span>`:''}
                  ${l.supplier?`<span>${escHtml(l.supplier)}</span>`:''}
                  ${Number(l.cost||0)>0?`<span style="color:var(--savanna)">R${Number(l.cost).toLocaleString('en-ZA',{maximumFractionDigits:0})}</span>`:''}
                  ${l.next_due_reading?`<span>Next due: ${l.next_due_reading} ${a.tracking_unit}</span>`:''}
                  ${l.next_due_date?`<span>Due: ${fmtDate(l.next_due_date)}</span>`:''}
                </div>
                ${l.notes?`<div style="font-size:12px;color:var(--text-sec);margin-top:4px">${escHtml(l.notes)}</div>`:''}
              </div>
            </div>
            <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted);flex-shrink:0;margin-left:10px">${fmtDate(l.log_date)}</span>
          </div>`;
        }).join('')}
      </div>` : `<div class="empty" style="padding:16px 0">No log entries yet</div>`}
    </div>
  </div>`;
}

function buildEcology() {
  const typeColors = { bird_survey:'var(--blue)', mammal_sighting:'var(--green)', invasive_monitoring:'var(--red)', vegetation_condition:'var(--green-hi)', erosion_monitoring:'var(--orange)' };
  return `
  <div class="col-gap">
    <div style="display:flex;justify-content:space-between;align-items:flex-end">
      <div class="section-title" style="margin-bottom:0">
        <div class="section-sub">— Environmental</div>
        <div class="section-h">Ecological Monitoring</div>
      </div>
      <button class="btn btn-primary" onclick="showModal('newObs')">+ Record Observation</button>
    </div>

    <div class="grid-4">
      ${statCard('Total Observations', state.ecoObs.length, 'logged', 'var(--accent-hi)')}
      ${statCard('Bird Surveys', state.ecoObs.filter(o=>o.observation_type==='bird_survey').length, 'records', 'var(--blue)')}
      ${statCard('Mammal Sightings', state.ecoObs.filter(o=>o.observation_type==='mammal_sighting').length, 'records', 'var(--green)')}
      ${statCard('Invasive Alerts', state.ecoObs.filter(o=>o.observation_type==='invasive_monitoring').length, 'sites', 'var(--red)')}
    </div>

    <div class="card">
      <div class="card-title">◉ Observation Log</div>

        ${state.ecoObs.length ? state.ecoObs.map(o => {
          const col = typeColors[o.observation_type] || 'var(--text-muted)';
          return `
          <div style="padding:12px 14px;background:var(--surface);border-radius:var(--r);border:1px solid var(--border)">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">
              <div style="display:flex;align-items:center;gap:10px">
                <span style="font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1px;color:${col};background:color-mix(in srgb,${col} 15%,transparent);padding:2px 8px;border-radius:3px;border:1px solid color-mix(in srgb,${col} 30%,transparent)">${o.observation_type.replace(/_/g,' ').toUpperCase()}</span>
                ${o.species ? `<span style="font-size:14px;font-weight:700;color:var(--text);font-style:italic">${escHtml(o.species)}</span>` : ''}
                ${o.count ? `<span style="font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--accent-hi)">n = ${o.count}</span>` : ''}
              </div>
              <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted)">${fmtDateTime(o.timestamp)}</span>
            </div>
            <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-sec);display:flex;gap:14px;flex-wrap:wrap">
              ${o.observer ? `<span>Observer: ${escHtml(o.observer)}</span>` : ''}
              ${o.location ? `<span>Location: ${escHtml(o.location)}</span>` : ''}
              ${o.confidence ? `<span style="color:var(--savanna)">${o.confidence.replace(/_/g,' ')}</span>` : ''}
            </div>
            ${o.notes ? `<div style="margin-top:6px;font-size:12px;color:var(--text-sec)">${escHtml(o.notes)}</div>` : ''}
          </div>`;
        }).join('') : '<div class="empty">No observations recorded yet</div>'}
      </div>
    </div>
  </div>`;
}

function buildChemicals() {
  const lowStock = state.chemicals.filter(c => c.stock_level < c.minimum_level);
  const recentUsage = state.chemUsage.slice(0,5);
  return `
  <div class="col-gap">
    <div style="display:flex;justify-content:space-between;align-items:flex-end">
      <div class="section-title" style="margin-bottom:0">
        <div class="section-sub">— Hazardous Materials</div>
        <div class="section-h">Chemical Store</div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost" onclick="showModal('chemUse')">Log Usage</button>
        <button class="btn btn-primary" onclick="showModal('newChem')">+ Add Chemical</button>
      </div>
    </div>

    <div class="grid-3">
      ${statCard('Products', state.chemicals.length, 'registered', 'var(--accent-hi)')}
      ${statCard('Low Stock', lowStock.length, 'alerts', lowStock.length > 0 ? 'var(--red)' : 'var(--green)')}
      ${statCard('Usage Logs', state.chemUsage.length, 'entries', 'var(--sky)')}
    </div>

    ${lowStock.length > 0 ? `
    <div class="card" style="border-color:color-mix(in srgb,var(--red) 40%,var(--border));background:color-mix(in srgb,var(--red) 5%,var(--dark-mid))">
      <div class="card-title" style="color:var(--red)">⊗ Low Stock Alerts</div>
      ${lowStock.map(c => `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">
          <span style="font-size:13px;color:var(--text)">${escHtml(c.name)}</span>
          <span style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--red)">${c.stock_level}${c.unit} / min ${c.minimum_level}${c.unit}</span>
        </div>
      `).join('')}
    </div>` : ''}

    <div class="col-gap" style="gap:10px">
      ${state.chemicals.length ? state.chemicals.map(c => {
        const isLow = c.stock_level < c.minimum_level;
        const pct = Math.min((c.stock_level / (Math.max(c.minimum_level * 3, 1))) * 100, 100);
        const hazCol = c.hazard_level === 'high' ? 'var(--red)' : c.hazard_level === 'moderate' ? 'var(--orange)' : 'var(--green)';
        const usageLogs = state.chemUsage.filter(u => u.chemical_id === c.id);
        const totalUsed = usageLogs.reduce((s,u) => s + Number(u.quantity_used||0), 0);
        return `
        <div class="card" style="${isLow ? 'border-color:color-mix(in srgb,var(--red) 40%,var(--border))' : ''}">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">
            <div style="flex:1">
              <div style="display:flex;align-items:center;gap:10px;margin-bottom:5px">
                <div style="font-size:15px;font-weight:700;color:var(--text)">${escHtml(c.name)}</div>
                <span style="font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1px;color:${hazCol};background:color-mix(in srgb,${hazCol} 15%,transparent);padding:2px 6px;border-radius:3px;border:1px solid color-mix(in srgb,${hazCol} 30%,transparent)">${(c.hazard_level||'').toUpperCase()}</span>
              </div>
              <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-sec);display:flex;gap:12px;flex-wrap:wrap">
                ${c.active_ingredient ? `<span style="font-style:italic;color:var(--text-muted)">${escHtml(c.active_ingredient)}</span>` : ''}
                <span>${c.application_type||''}</span>
                ${c.ppe_required ? `<span style="color:var(--orange)">PPE: ${escHtml(c.ppe_required)}</span>` : ''}
              </div>
            </div>
            <div style="text-align:right;flex-shrink:0;margin-left:16px">
              <div style="font-size:24px;font-weight:800;color:${isLow ? 'var(--red)' : 'var(--text)'};letter-spacing:-1px">${c.stock_level}<span style="font-size:13px;font-weight:400;color:var(--text-sec)"> ${c.unit}</span></div>
              ${isLow ? `<div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--red)">⊗ BELOW MIN</div>` : ''}
              <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted);margin-top:2px">Total used: ${totalUsed}${c.unit}</div>
            </div>
          </div>
          <div style="height:5px;background:var(--surface-hi);border-radius:3px;margin-bottom:4px">
            <div style="height:100%;width:${pct}%;background:${isLow?'var(--red)':'var(--green)'};border-radius:3px;transition:width 0.5s"></div>
          </div>
          <div style="display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted)">
            <span>Stock: ${c.stock_level}${c.unit}</span>
            <span>Min: ${c.minimum_level}${c.unit}</span>
            <span>${usageLogs.length} usage log${usageLogs.length!==1?'s':''}</span>
          </div>
          <div style="display:flex;gap:8px;margin-top:10px">
            <button class="btn btn-ghost" style="font-size:10px;padding:4px 10px" onclick="openChemUse(${c.id})">Log Use</button>
            <button class="btn btn-ghost" style="font-size:10px;padding:4px 10px" onclick="openStockAdjust(${c.id})">Adjust Stock</button>
          </div>
        </div>`;
      }).join('') : '<div class="empty card">No chemicals registered yet</div>'}
    </div>

    ${recentUsage.length ? `
    <div class="card">
      <div class="card-title">◎ Recent Usage Log</div>
      <div class="col-gap" style="gap:6px">
        ${recentUsage.map(u => {
          const chem = state.chemicals.find(c => c.id === u.chemical_id);
          const task = state.tasks.find(t => t.id === u.task_id);
          return `
          <div class="log-row">
            <div>
              <div style="font-weight:700;font-size:13px;margin-bottom:2px">${chem ? escHtml(chem.name) : 'Unknown'} — ${u.quantity_used}${chem?chem.unit:''}</div>
              <div class="log-meta">${u.operator||'—'} ${task ? '· '+escHtml(task.title) : ''} ${u.notes ? '· '+escHtml(u.notes) : ''}</div>
            </div>
            <div class="log-meta">${fmtDateTime(u.created_at)}</div>
          </div>`;
        }).join('')}
      </div>
    </div>` : ''}
  </div>`;
}
