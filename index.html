function buildSuppliersTab() {
  const suppliers = state.suppliers || [];
  const movements = state.stockMovements || [];
  const selId     = state.selectedSupplierTab;
  const sel       = suppliers.find(s => s.id === selId);

  // Per-supplier spend
  const spend = {};
  movements.filter(m=>m.movement_type==='in').forEach(m => {
    const sid = String(m.supplier_id);
    if (!spend[sid]) spend[sid] = { total:0, orders:new Set(), items:0 };
    spend[sid].total += Number(m.total_cost||0);
    spend[sid].orders.add(m.invoice_ref||'');
    spend[sid].items++;
  });

  if (sel) {
    // Supplier detail + purchase analysis
    const sid = String(sel.id);
    const sp  = spend[sid] || { total:0, orders:new Set(), items:0 };
    const orders = movements
      .filter(m => String(m.supplier_id)===sid && m.movement_type==='in')
      .sort((a,b) => new Date(b.movement_date||b.created_at)-new Date(a.movement_date||a.created_at));
    // Group by invoice
    const invMap = {};
    orders.forEach(m => {
      const inv = m.invoice_ref||'No ref';
      if (!invMap[inv]) invMap[inv] = { date:m.movement_date, lines:[], total:0 };
      invMap[inv].lines.push(m);
      invMap[inv].total += Number(m.total_cost||0);
    });
    // Monthly spend
    const monthly = {};
    orders.forEach(m => {
      const key = (m.movement_date||'').slice(0,7);
      if (!monthly[key]) monthly[key] = 0;
      monthly[key] += Number(m.total_cost||0);
    });

    return `
    <div class="col-gap">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
        <div style="display:flex;align-items:center;gap:12px">
          <button class="btn btn-ghost" onclick="state.selectedSupplierTab=null;render()">&#8592; Suppliers</button>
          <div>
            <div style="font-size:18px;font-weight:700;color:var(--text)">${escHtml(sel.name)}</div>
            ${sel.account_number?`<div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted)">Account: ${escHtml(sel.account_number)}</div>`:''}
          </div>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-ghost" onclick="openEditSupplier(${sel.id})">&#9998; Edit</button>
          <button class="btn btn-primary" onclick="state.grnSupplierId=${sel.id};showModal('stockIn')">+ Receive Delivery</button>
        </div>
      </div>

      <div class="grid-4">
        ${statCard('Total Spend','R'+sp.total.toLocaleString('en-ZA',{maximumFractionDigits:0}),'all time','var(--accent-hi)')}
        ${statCard('Invoices',sp.orders.size,'received','var(--sky)')}
        ${statCard('Line Items',sp.items,'total','var(--savanna)')}
        ${statCard('Contact',escHtml(sel.contact_person||'—'),'person','var(--text-sec)')}
      </div>

      ${sel.phone||sel.email?`
      <div class="card" style="padding:14px 16px">
        <div class="card-title">Contact Details</div>
        <div style="display:flex;gap:24px;flex-wrap:wrap;font-size:13px">
          ${sel.phone?`<div><span style="color:var(--text-muted);font-size:11px">Phone</span><div style="color:var(--text)">${escHtml(sel.phone)}</div></div>`:''}
          ${sel.email?`<div><span style="color:var(--text-muted);font-size:11px">Email</span><div style="color:var(--text)">${escHtml(sel.email)}</div></div>`:''}
          ${sel.address?`<div><span style="color:var(--text-muted);font-size:11px">Address</span><div style="color:var(--text)">${escHtml(sel.address)}</div></div>`:''}
        </div>
      </div>`:''}

      <!-- Monthly spend chart -->
      ${Object.keys(monthly).length ? `
      <div class="card">
        <div class="card-title">Monthly Spend</div>
        <div style="overflow-x:auto">
          <div style="display:flex;align-items:flex-end;gap:6px;min-height:80px;padding:0 4px">
            ${Object.entries(monthly).sort((a,b)=>a[0].localeCompare(b[0])).map(([month,amt])=>{
              const pct = Math.round((amt/Math.max(...Object.values(monthly)))*100);
              return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;min-width:40px">
                <div style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--accent);margin-bottom:3px">R${(amt/1000).toFixed(1)}k</div>
                <div style="width:100%;background:color-mix(in srgb,var(--accent) ${Math.max(pct,10)}%,var(--surface));border-radius:3px 3px 0 0;height:${Math.max(pct,6)}px;transition:height 0.3s"></div>
                <div style="font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--text-muted);margin-top:3px;white-space:nowrap">${month.slice(5)}</div>
              </div>`;
            }).join('')}
          </div>
        </div>
      </div>` : ''}

      <!-- Invoice history -->
      <div class="card" style="padding:0;overflow:hidden">
        <div style="padding:12px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">
          <div class="card-title" style="margin:0">Invoice History (${Object.keys(invMap).length})</div>
        </div>
        ${Object.entries(invMap).length ? Object.entries(invMap).map(([inv, data]) => `
        <div style="border-bottom:1px solid color-mix(in srgb,var(--border) 50%,transparent)">
          <div style="padding:10px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;background:var(--surface-hover)"
            onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'">
            <div>
              <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);font-weight:700">${escHtml(inv)}</div>
              <div style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted)">${fmtDate(data.date)}</div>
            </div>
            <div style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--savanna);font-weight:700">R${data.total.toFixed(2)}</div>
          </div>
          <div style="display:none;padding:0 16px 10px">
            <table style="width:100%;border-collapse:collapse;font-size:11px">
              <thead><tr style="background:var(--surface)">
                ${['ITEM','QTY','UNIT','UNIT COST','TOTAL'].map(h=>`<th style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted);padding:5px 6px;text-align:left;border-bottom:1px solid var(--border)">${h}</th>`).join('')}
              </tr></thead>
              <tbody>
                ${data.lines.map(l=>`<tr>
                  <td style="padding:4px 6px">${escHtml(l.stock_name||'—')}</td>
                  <td style="padding:4px 6px;font-family:'JetBrains Mono',monospace">${Number(l.quantity).toFixed(1)}</td>
                  <td style="padding:4px 6px;font-family:'JetBrains Mono',monospace">${escHtml(l.unit||'')}</td>
                  <td style="padding:4px 6px;font-family:'JetBrains Mono',monospace">R${Number(l.unit_cost||0).toFixed(2)}</td>
                  <td style="padding:4px 6px;font-family:'JetBrains Mono',monospace;color:var(--savanna)">R${Number(l.total_cost||0).toFixed(2)}</td>
                </tr>`).join('')}
              </tbody>
            </table>
          </div>
        </div>`).join('') : `<div class="empty" style="padding:20px">No invoices received yet</div>`}
      </div>
    </div>`;
  }

  // Supplier list view
  const totalSpend = Object.values(spend).reduce((s,v)=>s+v.total,0);
  return `
  <div class="col-gap">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px">
      <div class="section-title" style="margin-bottom:0">
        <div class="section-sub">— Stock</div>
        <div class="section-h">Suppliers</div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost" onclick="setStockView('stock')">&#8592; Stock</button>
        <button class="btn btn-primary" onclick="showModal('supplier')">+ Add Supplier</button>
      </div>
    </div>

    <div class="grid-4">
      ${statCard('Suppliers', suppliers.length, 'registered', 'var(--accent-hi)')}
      ${statCard('Total Spend', 'R'+totalSpend.toLocaleString('en-ZA',{maximumFractionDigits:0}), 'all time', 'var(--savanna)')}
      ${statCard('Active Orders', Object.values(spend).reduce((s,v)=>s+v.orders.size,0), 'invoices', 'var(--sky)')}
      ${statCard('Line Items', Object.values(spend).reduce((s,v)=>s+v.items,0), 'received', 'var(--text-sec)')}
    </div>

    <div class="card" style="padding:0;overflow:hidden">
      <table style="width:100%;border-collapse:collapse;font-size:12px">
        <thead><tr style="background:var(--surface)">
          ${['SUPPLIER','CONTACT','PHONE','ACCOUNT','TOTAL SPEND','INVOICES',''].map(h=>`<th style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted);padding:8px 12px;text-align:left;border-bottom:2px solid var(--border);white-space:nowrap">${h}</th>`).join('')}
        </tr></thead>
        <tbody>
          ${suppliers.length ? suppliers.map(s => {
            const sp = spend[String(s.id)] || { total:0, orders:new Set() };
            return `<tr style="border-bottom:1px solid color-mix(in srgb,var(--border) 40%,transparent);cursor:pointer"
              onclick="state.selectedSupplierTab=${s.id};render()">
              <td style="padding:8px 12px;font-weight:700;color:var(--text)">${escHtml(s.name)}</td>
              <td style="padding:8px 12px;color:var(--text-sec)">${escHtml(s.contact_person||'—')}</td>
              <td style="padding:8px 12px;font-family:'JetBrains Mono',monospace;font-size:10px">${escHtml(s.phone||'—')}</td>
              <td style="padding:8px 12px;font-family:'JetBrains Mono',monospace;font-size:10px">${escHtml(s.account_number||'—')}</td>
              <td style="padding:8px 12px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--savanna);font-weight:700">R${sp.total.toLocaleString('en-ZA',{maximumFractionDigits:0})}</td>
              <td style="padding:8px 12px;font-family:'JetBrains Mono',monospace;font-size:10px">${sp.orders.size}</td>
              <td style="padding:8px 12px"><button class="btn btn-ghost" style="font-size:10px" onclick="event.stopPropagation();openEditSupplier(${s.id})">&#9998;</button></td>
            </tr>`;
          }).join('') : `<tr><td colspan="7" style="padding:30px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-muted)">No suppliers yet</td></tr>`}
        </tbody>
      </table>
    </div>
  </div>`;
}

function buildStaffFolder() {
  const staffId = state.viewingStaffId;
  const staff   = state.staff.find(s=>s.id===staffId);
  if(!staff) return buildStaff();
  const docs = state.staffDocuments.filter(d=>d.staff_id===staffId);
  const DOC_TYPES = {
    contract:{label:'Employment Contract',icon:'◈',color:'var(--accent-hi)'},
    addendum:{label:'Contract Addendum',icon:'◈',color:'var(--sky)'},
    warning:{label:'Warning / Disciplinary',icon:'⊗',color:'var(--red)'},
    promotion:{label:'Promotion / Role Change',icon:'◉',color:'var(--green)'},
    performance:{label:'Performance Review',icon:'◎',color:'var(--savanna)'},
    training:{label:'Training Certificate',icon:'◎',color:'var(--blue)'},
    id_copy:{label:'ID / Passport Copy',icon:'◧',color:'var(--text-sec)'},
    medical:{label:'Medical Certificate',icon:'◎',color:'var(--orange)'},
    leave_form:{label:'Leave Form',icon:'◧',color:'var(--text-muted)'},
    other:{label:'Other Document',icon:'◧',color:'var(--text-muted)'},
  };
  const initials=(staff.name||'?').split(' ').map(n=>n[0]).join('').slice(0,2).toUpperCase();
  const pct=Math.round((['surname','date_of_birth','id_number','phone','emergency_contact_name','bank_account','allergies','residential_address'].filter(f=>staff[f]).length/8)*100);
  return `
  <div class="col-gap">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px">
      <div style="display:flex;align-items:center;gap:14px">
        <div style="width:52px;height:52px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:var(--dark);flex-shrink:0">${initials}</div>
        <div>
          <div class="section-h" style="margin:0">${escHtml(staff.name+(staff.surname?' '+staff.surname:''))}</div>
          <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent)">${escHtml(staff.role||'—')} · ${escHtml(staff.department||'—')}</div>
          <div style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted);margin-top:2px">${staff.employee_number?'#'+escHtml(staff.employee_number)+' · ':''}Started ${fmtDate(staff.start_date)}</div>
        </div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-ghost" onclick="state.viewingStaffId=null;setStaffView('register')">&#8592; Register</button>
        <button class="btn btn-ghost" onclick="openEditStaff(${staff.id})">&#9998; Edit Profile</button>
        <button class="btn btn-primary" onclick="openAddDoc(${staff.id})">+ Add Document</button>
      </div>
    </div>
    <div class="grid-4">
      ${statCard('Profile',pct+'%','complete',pct<50?'var(--red)':pct<80?'var(--orange)':'var(--green)')}
      ${statCard('Documents',docs.length,'on file','var(--sky)')}
      ${statCard('Leave Balance',Math.max(0,Number(staff.annual_leave_days||15)-Number(staff.leave_days_accumulated||0))+'d','remaining','var(--savanna)')}
      ${statCard('Active Warnings',docs.filter(d=>d.doc_type==='warning'&&d.status==='active').length,'on record',docs.filter(d=>d.doc_type==='warning'&&d.status==='active').length>0?'var(--red)':'var(--green)')}
    </div>
    ${Object.entries(DOC_TYPES).map(([type,meta])=>{
      const typeDocs=docs.filter(d=>d.doc_type===type);
      if(!typeDocs.length) return '';
      return `<div class="card">
        <div class="card-title" style="color:${meta.color}">${meta.icon} ${meta.label} (${typeDocs.length})</div>
        <div class="col-gap" style="gap:6px">
          ${typeDocs.map(doc=>{
            const isExpiring=doc.expiry_date&&new Date(doc.expiry_date)<new Date(Date.now()+90*24*3600*1000);
            const isExpired=doc.expiry_date&&new Date(doc.expiry_date)<new Date();
            return `<div style="display:flex;justify-content:space-between;align-items:flex-start;padding:10px 12px;background:var(--surface);border-radius:var(--r);border:1px solid ${isExpired?'color-mix(in srgb,var(--red) 40%,var(--border))':isExpiring?'color-mix(in srgb,var(--orange) 40%,var(--border))':'var(--border)'}">
              <div>
                <div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:3px">${escHtml(doc.title)}</div>
                <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted);display:flex;gap:10px;flex-wrap:wrap">
                  ${doc.issued_date?`<span>Issued: ${fmtDate(doc.issued_date)}</span>`:''}
                  ${doc.expiry_date?`<span style="color:${isExpired?'var(--red)':isExpiring?'var(--orange)':'var(--text-muted)'}">Expires: ${fmtDate(doc.expiry_date)}</span>`:''}
                  ${doc.issued_by?`<span>By: ${escHtml(doc.issued_by)}</span>`:''}
                </div>
                ${doc.description?`<div style="font-size:11px;color:var(--text-sec);margin-top:4px">${escHtml(doc.description)}</div>`:''}
              </div>
              ${doc.file_url?`<a href="${escHtml(doc.file_url)}" target="_blank" class="btn btn-ghost" style="font-size:10px;padding:4px 10px;flex-shrink:0;margin-left:10px">&#128196; View</a>`:''}
            </div>`;
          }).join('')}
        </div>
      </div>`;
    }).join('')}
    ${!docs.length?`<div class="empty card">No documents on file yet — click Add Document to upload the first one</div>`:''}
  </div>`;
}

// COSTS PAGE
// ═══════════════════════════════════════
function buildCosts() {
  const entries = state.costEntries || [];
  const total = entries.reduce((s,e)=>s+Number(e.total_cost||e.quantity*e.unit_cost||0),0);
  const byCategory = {};
  entries.forEach(e=>{const c=e.category||'other';if(!byCategory[c])byCategory[c]=0;byCategory[c]+=Number(e.total_cost||e.quantity*e.unit_cost||0);});
  return `
  <div class="col-gap">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px">
      <div class="section-title" style="margin-bottom:0">
        <div class="section-sub">— Finance</div>
        <div class="section-h">Cost Ledger</div>
      </div>
      <button class="btn btn-primary" onclick="showModal('costEntry')">+ Log Cost</button>
    </div>
    <div class="grid-4">
      ${statCard('Total Costs','R'+total.toLocaleString('en-ZA',{minimumFractionDigits:0,maximumFractionDigits:0}),'all time','var(--accent-hi)')}
      ${statCard('Entries',entries.length,'logged','var(--sky)')}
      ${statCard('Categories',Object.keys(byCategory).length,'active','var(--savanna)')}
      ${statCard('This Month','R'+entries.filter(e=>{const d=new Date(e.entry_date||e.created_at);const n=new Date();return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear();}).reduce((s,e)=>s+Number(e.total_cost||e.quantity*e.unit_cost||0),0).toLocaleString('en-ZA',{minimumFractionDigits:0,maximumFractionDigits:0}),'current month','var(--orange)')}
    </div>
    <div class="card" style="padding:0;overflow:hidden"><div style="overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:12px">
        <thead><tr style="background:var(--surface)">
          ${['DATE','CATEGORY','DESCRIPTION','QTY','UNIT COST','TOTAL','SUPPLIER','BY'].map(h=>`<th style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted);padding:7px 8px;text-align:left;border-bottom:2px solid var(--border);white-space:nowrap">${h}</th>`).join('')}
        </tr></thead>
        <tbody>
          ${entries.slice(0,50).map(e=>`
          <tr style="border-bottom:1px solid color-mix(in srgb,var(--border) 40%,transparent)">
            <td style="padding:5px 8px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted);white-space:nowrap">${fmtDate(e.entry_date||e.created_at)}</td>
            <td style="padding:5px 8px;font-family:'JetBrains Mono',monospace;font-size:10px">${escHtml(e.category||'—')}</td>
            <td style="padding:5px 8px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(e.description||'—')}</td>
            <td style="padding:5px 8px;font-family:'JetBrains Mono',monospace;font-size:10px;text-align:right">${Number(e.quantity||0).toFixed(1)}</td>
            <td style="padding:5px 8px;font-family:'JetBrains Mono',monospace;font-size:10px;text-align:right">R${Number(e.unit_cost||0).toFixed(2)}</td>
            <td style="padding:5px 8px;font-family:'JetBrains Mono',monospace;font-size:10px;text-align:right;font-weight:700;color:var(--accent-hi)">R${Number(e.total_cost||e.quantity*e.unit_cost||0).toFixed(2)}</td>
            <td style="padding:5px 8px;font-size:11px;color:var(--text-muted)">${escHtml(e.supplier||'—')}</td>
            <td style="padding:5px 8px;font-size:11px;color:var(--text-muted)">${escHtml(e.recorded_by||'—')}</td>
          </tr>`).join('')}
          ${!entries.length?`<tr><td colspan="8" style="padding:30px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-muted)">No cost entries yet</td></tr>`:''}
        </tbody>
      </table>
    </div></div>
  </div>`;
}

function buildHS() {
  const view = state.hsView || 'dashboard';
  if (view === 'incidents')    return buildHSIncidents();
  if (view === 'checklists')   return buildHSChecklists();
  if (view === 'risks')        return buildHSRisks();
  if (view === 'certificates') return buildHSCertificates();
  if (view === 'contractors')  return buildHSContractors();
  if (view === 'firearms')     return buildHSFirearms();
  return buildHSDashboard();
}

function buildHSDashboard() {
  const now = new Date();
  const in60 = new Date(Date.now() + 60*24*3600*1000).toISOString().slice(0,10);
  const today = now.toISOString().slice(0,10);

  const openIncidents   = state.hsIncidents.filter(i => i.status !== 'closed');
  const doelPending     = state.hsIncidents.filter(i => i.doel_reportable && !i.doel_reported_at);
  const expiredCerts    = state.hsCertificates.filter(c => c.expiry_date && c.expiry_date < today);
  const expiring60      = state.hsCertificates.filter(c => c.expiry_date && c.expiry_date >= today && c.expiry_date <= in60);
  const overdueRisks    = state.hsRisks.filter(r => r.status === 'active' && r.review_due && r.review_due < today);
  const recentFailures  = state.hsChecklistRuns.filter(r => r.out_of_range && new Date(r.completed_at) > new Date(Date.now()-7*24*3600*1000));
  const firearmsOut     = []; // Would need movement data

  const INCIDENT_TYPE_LABELS = {
    injury:'Injury', illness:'Illness', near_miss:'Near Miss', property_damage:'Property Damage',
    wildlife:'Wildlife', lightning:'Lightning', fire:'Fire', vehicle:'Vehicle',
    firearm:'Firearm', security:'Security', environmental:'Environmental', other:'Other'
  };
  const SEV_COLOR = { minor:'var(--green)', moderate:'var(--orange)', serious:'var(--red)', fatal:'#7f1d1d' };

  return `
  <div class="col-gap">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px">
      <div class="section-title" style="margin-bottom:0">
        <div class="section-sub">— Compliance</div>
        <div class="section-h">Health &amp; Safety</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-ghost" onclick="setHsView('incidents')">&#9650; Incidents</button>
        <button class="btn btn-ghost" onclick="setHsView('checklists')">&#9651; Checklists</button>
        <button class="btn btn-ghost" onclick="setHsView('risks')">&#9670; Risk Register</button>
        <button class="btn btn-ghost" onclick="setHsView('certificates')">&#9671; Certificates</button>
        <button class="btn btn-ghost" onclick="setHsView('contractors')">&#9672; Contractors</button>
        <button class="btn btn-ghost" onclick="setHsView('firearms')">&#9673; Firearms</button>
        <button class="btn btn-primary" onclick="showModal('hsIncident')">+ Log Incident</button>
      </div>
    </div>

    <!-- KPI row -->
    <div class="grid-4">
      ${statCard('Open Incidents', openIncidents.length, 'active', openIncidents.length>0?'var(--red)':'var(--green)')}
      ${statCard('DoEL Pending', doelPending.length, 'to report', doelPending.length>0?'var(--red)':'var(--green)')}
      ${statCard('Certs Expiring', expiring60.length, 'within 60 days', expiring60.length>0?'var(--orange)':'var(--green)')}
      ${statCard('Checklist Failures', recentFailures.length, 'last 7 days', recentFailures.length>0?'var(--orange)':'var(--green)')}
    </div>

    <!-- Alerts -->
    ${(doelPending.length || expiredCerts.length || overdueRisks.length) ? `
    <div class="card" style="border-color:color-mix(in srgb,var(--red) 40%,var(--border))">
      <div class="card-title" style="color:var(--red)">⊗ Compliance Alerts</div>
      ${doelPending.map(i=>`
        <div class="alert-banner" style="border-color:var(--red);background:color-mix(in srgb,var(--red) 8%,transparent);margin-bottom:6px">
          <span class="alert-icon">🚨</span>
          <div>
            <div style="font-weight:700;font-size:13px">DoEL Report Overdue — ${escHtml(INCIDENT_TYPE_LABELS[i.incident_type]||i.incident_type)}</div>
            <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted)">${fmtDate(i.occurred_at)} · Deadline: ${fmtDate(i.doel_deadline)}</div>
          </div>
        </div>`).join('')}
      ${expiredCerts.map(cert=>`
        <div class="alert-banner" style="border-color:var(--red);background:color-mix(in srgb,var(--red) 8%,transparent);margin-bottom:6px">
          <span class="alert-icon">⊗</span>
          <div>
            <div style="font-weight:700;font-size:13px">EXPIRED: ${escHtml(cert.subject||cert.cert_type)}</div>
            <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted)">Expired ${fmtDate(cert.expiry_date)}${cert.issuer?' · '+cert.issuer:''}</div>
          </div>
        </div>`).join('')}
      ${overdueRisks.map(r=>`
        <div class="alert-banner" style="border-color:var(--orange);background:color-mix(in srgb,var(--orange) 8%,transparent);margin-bottom:6px">
          <span class="alert-icon">⚠</span>
          <div>
            <div style="font-weight:700;font-size:13px">Risk Review Overdue — ${escHtml(r.hazard)}</div>
            <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted)">Due ${fmtDate(r.review_due)} · Rating: ${r.risk_rating}</div>
          </div>
        </div>`).join('')}
    </div>` : ''}

    <!-- Recent incidents -->
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div class="card-title" style="margin:0">⊕ Recent Incidents</div>
        <button class="btn btn-ghost" style="font-size:10px" onclick="setHsView('incidents')">View all</button>
      </div>
      ${openIncidents.length ? `
      <div class="col-gap" style="gap:6px">
        ${openIncidents.slice(0,5).map(i=>`
        <div style="display:flex;justify-content:space-between;align-items:flex-start;padding:10px 12px;background:var(--surface);border-radius:var(--r);border:1px solid var(--border);cursor:pointer" onclick="setHsView('incidents')">

function buildHSChecklists() {
  return `
  <div class="col-gap">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px">
      <div class="section-title" style="margin-bottom:0">

      </div>
      <button class="btn btn-ghost" onclick="setHsView('dashboard')">&#8592; Dashboard</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px">
      ${state.hsChecklists.map(t=>{
        const runs = state.hsChecklistRuns.filter(r=>r.template_id===t.id);
        const lastRun = runs.sort((a,b)=>new Date(b.completed_at)-new Date(a.completed_at))[0];
        const items = Array.isArray(t.items) ? t.items : (typeof t.items === 'string' ? JSON.parse(t.items||'[]') : []);
        return `
        <div class="card" style="cursor:pointer" onclick="openChecklistRun('${t.id}')">
          <div style="font-size:14px;font-weight:700;color:var(--text);margin-bottom:4px">${escHtml(t.name)}</div>
          <div style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted);margin-bottom:8px">${(t.frequency||'').replace(/_/g,' ').toUpperCase()} · ${escHtml(t.department||'All')}</div>
          <div style="font-size:11px;color:var(--text-sec);margin-bottom:10px">${items.length} check item${items.length!==1?'s':''}</div>
          ${lastRun?`
          <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:color-mix(in srgb,${lastRun.out_of_range?'var(--red)':'var(--green)'} 10%,transparent);border-radius:var(--r)">
            <span style="font-family:'JetBrains Mono',monospace;font-size:9px;color:${lastRun.out_of_range?'var(--red)':'var(--green)'}">${lastRun.out_of_range?'⚠ FAILED':'✓ PASSED'}</span>
            <span style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted)">${fmtDate(lastRun.completed_at)}</span>
          </div>` : `<div style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted);padding:6px 10px;background:var(--surface);border-radius:var(--r)">Not yet completed</div>`}
          <button class="btn btn-primary" style="width:100%;margin-top:10px;font-size:10px" onclick="event.stopPropagation();openChecklistRun('${t.id}')">&#9654; Run Now</button>
        </div>`;
      }).join('')}
    </div>

    ${state.hsChecklistRuns.length ? `
    <div class="card">
      <div class="card-title">Recent Runs</div>
      <div style="overflow-x:auto">
        <table style="width:100%;border-collapse:collapse;font-size:12px">
          <thead><tr style="background:var(--surface)">
            ${['CHECKLIST','DATE','BY','RESULT','NOTES'].map(h=>`<th style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted);padding:6px 8px;text-align:left;border-bottom:2px solid var(--border)">${h}</th>`).join('')}
          </tr></thead>
          <tbody>
            ${state.hsChecklistRuns.slice(0,20).map(r=>{
              const tmpl = state.hsChecklists.find(t=>t.id===r.template_id);
              const staffMember = state.staff.find(s=>s.id===r.completed_by);
              return `<tr style="border-bottom:1px solid color-mix(in srgb,var(--border) 40%,transparent)">
                <td style="padding:5px 8px;font-weight:600">${escHtml(tmpl?tmpl.name:'Unknown')}</td>
                <td style="padding:5px 8px;font-family:'JetBrains Mono',monospace;font-size:10px">${fmtDate(r.completed_at)}</td>
                <td style="padding:5px 8px;font-size:11px">${escHtml(staffMember?staffMember.name:r.completed_by||'—')}</td>
                <td style="padding:5px 8px"><span style="font-family:'JetBrains Mono',monospace;font-size:9px;color:${r.out_of_range?'var(--red)':'var(--green)'}">${r.out_of_range?'⚠ FAILED':'✓ PASSED'}</span></td>
                <td style="padding:5px 8px;font-size:11px;color:var(--text-muted)">${escHtml(r.notes||'—')}</td>

}

  return `
  <div class="col-gap">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px">
      <div class="section-title" style="margin-bottom:0">
        <div class="section-sub">— H&amp;S</div>
        <div class="section-h">Risk Register</div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost" onclick="setHsView('dashboard')">&#8592; Dashboard</button>
        <button class="btn btn-primary" onclick="showModal('hsRisk')">+ Add Risk</button>
      </div>
    </div>

    <div class="grid-4">
      ${statCard('High (≥15)', activeRisks.filter(r=>r.risk_rating>=15).length, 'critical', 'var(--red)')}
      ${statCard('Medium (8–14)', activeRisks.filter(r=>r.risk_rating>=8&&r.risk_rating<15).length, 'risks', 'var(--orange)')}
      ${statCard('Low (<8)', activeRisks.filter(r=>r.risk_rating<8).length, 'risks', 'var(--green)')}
      ${statCard('Reviews Due', activeRisks.filter(r=>r.review_due&&r.review_due<new Date().toISOString().slice(0,10)).length, 'overdue', 'var(--red)')}
    </div>

    <div class="card" style="padding:0;overflow:hidden">
      <div style="overflow-x:auto">
        <table style="width:100%;border-collapse:collapse;font-size:12px">
          <thead><tr style="background:var(--surface)">
            ${['CATEGORY','HAZARD','WHO AT RISK','RATING','RESIDUAL','REVIEW DUE','STATUS'].map(h=>`<th style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted);padding:8px 10px;text-align:left;border-bottom:2px solid var(--border);white-space:nowrap">${h}</th>`).join('')}
          </tr></thead>
          <tbody>
            ${activeRisks.map(r=>`
            <tr style="border-bottom:1px solid color-mix(in srgb,var(--border) 40%,transparent)">
              <td style="padding:6px 10px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted)">${escHtml((r.category||'').replace(/_/g,' '))}</td>
              <td style="padding:6px 10px;font-weight:600;color:var(--text)">${escHtml(r.hazard||'—')}</td>
              <td style="padding:6px 10px;font-size:11px">${Array.isArray(r.who_at_risk)?r.who_at_risk.join(', '):'—'}</td>
              <td style="padding:6px 10px;text-align:center">
                <span style="font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:800;color:${RISK_COLOR(r.risk_rating||0)}">${r.risk_rating||'—'}</span>
                <div style="font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--text-muted)">${r.likelihood||'?'}×${r.severity||'?'}</div>
              </td>
              <td style="padding:6px 10px;text-align:center">
                <span style="font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:800;color:${RISK_COLOR(r.residual_rating||0)}">${r.residual_rating||'—'}</span>
              </td>
              <td style="padding:6px 10px;font-family:'JetBrains Mono',monospace;font-size:10px;color:${r.review_due&&r.review_due<new Date().toISOString().slice(0,10)?'var(--red)':'var(--text-muted)'}">${fmtDate(r.review_due)}</td>
              <td style="padding:6px 10px"><span style="font-family:'JetBrains Mono',monospace;font-size:9px;color:${r.status==='active'?'var(--green)':'var(--text-muted)'}">${(r.status||'').toUpperCase()}</span></td>
            </tr>`).join('')}
            ${!activeRisks.length?`<tr><td colspan="7" style="padding:30px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-muted)">No risks in register — click Add Risk to get started</td></tr>`:''}
          </tbody>
        </table>
      </div>
    </div>
  </div>`;
}

function buildHSCertificates() {
  const today = new Date().toISOString().slice(0,10);
  const in60 = new Date(Date.now()+60*24*3600*1000).toISOString().slice(0,10);
  const sorted = [...state.hsCertificates].sort((a,b)=>(a.expiry_date||'9999')>(b.expiry_date||'9999')?1:-1);

  return `
  <div class="col-gap">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px">
      <div class="section-title" style="margin-bottom:0">
        <div class="section-sub">— H&amp;S</div>
        <div class="section-h">Certificates &amp; Compliance Docs</div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost" onclick="setHsView('dashboard')">&#8592; Dashboard</button>
        <button class="btn btn-primary" onclick="showModal('hsCert')">+ Add Certificate</button>
      </div>
    </div>

    <div class="grid-4">
      ${statCard('Total', state.hsCertificates.length, 'on record', 'var(--accent-hi)')}
      ${statCard('Expired', sorted.filter(c=>c.expiry_date&&c.expiry_date<today).length, 'action needed', 'var(--red)')}
      ${statCard('Expiring (60d)', sorted.filter(c=>c.expiry_date&&c.expiry_date>=today&&c.expiry_date<=in60).length, 'renew soon', 'var(--orange)')}
      ${statCard('Current', sorted.filter(c=>!c.expiry_date||(c.expiry_date&&c.expiry_date>in60)).length, 'valid', 'var(--green)')}
    </div>

    <div class="card" style="padding:0;overflow:hidden">
      <div style="overflow-x:auto">
        <table style="width:100%;border-collapse:collapse;font-size:12px">
          <thead><tr style="background:var(--surface)">
            ${['TYPE','SUBJECT','REF #','ISSUER','ISSUED','EXPIRY','STATUS'].map(h=>`<th style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted);padding:8px 10px;text-align:left;border-bottom:2px solid var(--border);white-space:nowrap">${h}</th>`).join('')}
          </tr></thead>
          <tbody>
            ${sorted.map(cert=>{
              const expired = cert.expiry_date && cert.expiry_date < today;
              const expiring = cert.expiry_date && cert.expiry_date >= today && cert.expiry_date <= in60;
              const col = expired ? 'var(--red)' : expiring ? 'var(--orange)' : 'var(--green)';
              const statusLabel = expired ? 'EXPIRED' : expiring ? 'EXPIRING' : 'CURRENT';
              return `<tr style="border-bottom:1px solid color-mix(in srgb,var(--border) 40%,transparent)">
                <td style="padding:6px 10px;font-weight:600;color:var(--text)">${escHtml((cert.cert_type||'').replace(/_/g,' '))}</td>
                <td style="padding:6px 10px">${escHtml(cert.subject||'—')}</td>
                <td style="padding:6px 10px;font-family:'JetBrains Mono',monospace;font-size:10px">${escHtml(cert.reference_number||'—')}</td>
                <td style="padding:6px 10px;font-size:11px;color:var(--text-sec)">${escHtml(cert.issuer||'—')}</td>
                <td style="padding:6px 10px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted)">${fmtDate(cert.issued_date)}</td>
                <td style="padding:6px 10px;font-family:'JetBrains Mono',monospace;font-size:10px;color:${col};font-weight:${expired?'700':'400'}">${cert.expiry_date?fmtDate(cert.expiry_date):'No expiry'}</td>
                <td style="padding:6px 10px">
                  <span style="font-family:'JetBrains Mono',monospace;font-size:9px;color:${col}">${statusLabel}</span>
                  ${cert.document_url?` <a href="${escHtml(cert.document_url)}" target="_blank" style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--sky);text-decoration:none;margin-left:6px">&#128196;</a>`:''}
                </td>
              </tr>`;
            }).join('')}
            ${!sorted.length?`<tr><td colspan="7" style="padding:30px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-muted)">No certificates on record — click Add Certificate to start</td></tr>`:''}
          </tbody>
        </table>
      </div>
    </div>
  </div>`;
}

// ─── FUEL VAT / COST HANDLERS ────────────────────────────────────────
window.calcDeliveryFromCPL = () => {
  const litres = parseFloat(document.getElementById('fd-litres')?.value || 0);
  const cpl    = parseFloat(document.getElementById('fd-cost')?.value   || 0);
  if (litres > 0 && cpl > 0) {
    const el = document.getElementById('fd-total-input');
    if (el) el.value = (litres * cpl).toFixed(2);
  }
  calcDeliveryTotal();
};

window.calcDeliveryFromTotal = () => {
  const litres    = parseFloat(document.getElementById('fd-litres')?.value      || 0);
  const totalExcl = parseFloat(document.getElementById('fd-total-input')?.value || 0);
  if (litres > 0 && totalExcl > 0) {
    const el = document.getElementById('fd-cost');
    if (el) el.value = (totalExcl / litres).toFixed(3);
  }
  calcDeliveryTotal();
};

window.calcDeliveryTotal = () => {
  const litres     = parseFloat(document.getElementById('fd-litres')?.value       || 0);
  const cpl        = parseFloat(document.getElementById('fd-cost')?.value         || 0);
  const totalInput = parseFloat(document.getElementById('fd-total-input')?.value  || 0);
  const hasTax     = document.getElementById('fd-tax')?.checked || false;
  const VAT_RATE   = 0.15;
  const exclVat    = totalInput > 0 ? totalInput : (litres * cpl);
  const vatAmt     = hasTax ? exclVat * VAT_RATE : 0;
  const inclVat    = exclVat + vatAmt;
  const fmt = (n) => 'R' + n.toLocaleString('en-ZA', { minimumFractionDigits:2, maximumFractionDigits:2 });
  const set = (id, val) => { const el = document.getElementById(id); if(el) el.textContent = val; };
  set('fd-excl',          fmt(exclVat));
  set('fd-vat-line',      hasTax ? fmt(vatAmt) : 'R0.00');
  set('fd-vat-amount',    hasTax ? fmt(vatAmt) : 'R0.00');
  set('fd-total-display', fmt(inclVat));
  set('fd-ledger-amount', fmt(exclVat));
};

window.submitLogin = async () => {
  const email    = document.getElementById('login-email')?.value?.trim() || state.loginEmail;
  const password = document.getElementById('login-pass')?.value || state.loginPassword;
  if (!email || !password) { state.authError = 'Email and password required'; render(); return; }
  state.loginLoading = true;
  state.authError    = null;
  render();
  try {
    const data = await signIn(email, password);
    state.session      = data.session;
    state.authUser     = data.user;
    state.loginLoading = false;
    state.loginEmail   = '';
    state.loginPassword= '';
    // Now load data
    await loadAll();
  } catch(e) {
    state.loginLoading = false;
    state.authError    = e.message === 'Invalid login credentials'
      ? 'Incorrect email or password'
      : e.message;
    render();
  }
};

window.grnCheckPrice = (input, itemId) => {
  grnCalc();
  const lastCost=parseFloat(input.dataset.lastCost||0);
  const newCost=parseFloat(input.value||0);
  const alertEl=document.getElementById('grn-price-alert-'+itemId);
  if(!alertEl||lastCost===0) return;
  const diff=Math.abs((newCost-lastCost)/lastCost)*100;
  if(diff>=10&&newCost>0){const dir=newCost>lastCost?'▲':'▼';const col=newCost>lastCost?'var(--red)':'var(--green)';alertEl.style.display='block';alertEl.style.color=col;alertEl.textContent=dir+' '+diff.toFixed(0)+'% — was R'+lastCost.toFixed(2);input.style.borderColor=col;input.style.background='color-mix(in srgb,'+col+' 8%,transparent)';}
  else{alertEl.style.display='none';input.style.borderColor='';input.style.background='';}
};

window.grnFilterBySupplier = (supId) => {
  const sid=Number(supId);
  const tbody=document.getElementById('grn-items-body');
  if(!tbody) return;
  if(!sid){const rows=[...tbody.querySelectorAll('.grn-row')];rows.sort((a,b)=>Number(a.dataset.origIndex||0)-Number(b.dataset.origIndex||0));rows.forEach(row=>{tbody.appendChild(row);row.style.opacity='1';row.style.background='';});return;}
  const supplierItemIds=new Set(state.stockMovements.filter(m=>m.movement_type==='in'&&m.supplier_id===sid).map(m=>m.stock_item_id));
  const rows=[...tbody.querySelectorAll('.grn-row')];
  rows.forEach((row,i)=>{if(!row.dataset.origIndex)row.dataset.origIndex=i;});
  const matched=rows.filter(r=>supplierItemIds.has(Number(r.dataset.id)));
  const rest=rows.filter(r=>!supplierItemIds.has(Number(r.dataset.id)));
  [...matched,...rest].forEach(row=>tbody.appendChild(row));
  matched.forEach(row=>{row.style.opacity='1';row.style.background='color-mix(in srgb,var(--accent) 6%,transparent)';});
  rest.forEach(row=>{row.style.opacity='0.5';row.style.background='';});
  if(matched.length===0)rest.forEach(row=>{row.style.opacity='1';row.style.background='';});
};

let grnRowCount = 3;

window.addGrnRow = () => {
  const container = document.getElementById('si-items');
  if (!container) return;
  const items = state.stockItems || [];
  const div = document.createElement('div');
  div.innerHTML = buildGrnRow(grnRowCount, items);

};

window.removeGrnRow = (idx) => {
  const row = document.getElementById('si-row-'+idx);
  if (row) row.remove();
  grnCalc();
};

window.grnCalc = () => {
  let subtotal = 0, vatTotal = 0;
  // Find all rows
  document.querySelectorAll('[id^="si-row-"]').forEach(row => {
    const idx = row.id.replace('si-row-','');
    const qty  = parseFloat(document.getElementById('si-qty-'+idx)?.value  || 0);
    const cost = parseFloat(document.getElementById('si-cost-'+idx)?.value || 0);
    const hasVat = document.getElementById('si-vat-'+idx)?.checked || false;
    const lineExcl = qty * cost;
    const lineVat  = hasVat ? lineExcl * 0.15 : 0;
    const el = document.getElementById('si-line-total-'+idx);
    if (el) el.value = lineExcl > 0 ? lineExcl.toFixed(2) : '';
    subtotal += lineExcl;
    vatTotal += lineVat;
  });
  const fmt = n => 'R'+n.toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2});
  const s = (id,v) => { const el=document.getElementById(id); if(el) el.textContent=v; };
  s('si-subtotal',   fmt(subtotal));
  s('si-vat-total',  fmt(vatTotal));
  s('si-grand-total',fmt(subtotal+vatTotal));
};

window.grnCalcFromTotal = (idx) => {
  const qty   = parseFloat(document.getElementById('si-qty-'+idx)?.value        || 0);
  const total = parseFloat(document.getElementById('si-line-total-'+idx)?.value || 0);
  if (qty > 0 && total > 0) {
    const el = document.getElementById('si-cost-'+idx);
    if (el) el.value = (total/qty).toFixed(2);
  }
  grnCalc();
};

window.submitStockIn = async () => {
  const supplierId  = document.getElementById('si-supplier')?.value;
  const invoiceRef  = document.getElementById('si-invoice')?.value?.trim();
  const dateVal     = document.getElementById('si-date')?.value || new Date().toISOString().slice(0,10);
  if (!invoiceRef) { toast('Invoice number required','error'); return; }

  // Check for duplicate invoice
  const existing = state.stockMovements.find(m => m.invoice_ref === invoiceRef);
  if (existing) { toast('Invoice '+invoiceRef+' already exists — cannot duplicate','error'); return; }

  const rows = [];
  document.querySelectorAll('[id^="si-row-"]').forEach(row => {
    const idx     = row.id.replace('si-row-','');
    const itemId  = document.getElementById('si-item-'+idx)?.value;
    const qty     = parseFloat(document.getElementById('si-qty-'+idx)?.value  || 0);
    const cost    = parseFloat(document.getElementById('si-cost-'+idx)?.value || 0);
    const unit    = document.getElementById('si-unit-'+idx)?.value || 'each';
    const hasVat  = document.getElementById('si-vat-'+idx)?.checked || false;
    if (itemId && qty > 0) rows.push({ itemId: Number(itemId), qty, cost, unit, hasVat });
  });

  if (!rows.length) { toast('Add at least one item','error'); return; }

  try {
    const supplier = state.suppliers.find(s=>String(s.id)===String(supplierId));
    for (const row of rows) {
      const item = state.stockItems.find(i=>i.id===row.itemId);
      const lineTotal = row.qty * row.cost;
      const vatAmt    = row.hasVat ? lineTotal * 0.15 : 0;
      await sb.post('stock_movements', {
        stock_item_id:   row.itemId,
        stock_name:      item?.stock_name || null,
        movement_type:   'in',
        quantity:        row.qty,
        unit:            row.unit,
        unit_cost:       row.cost,
        total_cost:      lineTotal,
        vat_amount:      vatAmt,
        tax_included:    row.hasVat,
        supplier_id:     supplierId ? Number(supplierId) : null,
        supplier:        supplier?.name || null,
        invoice_ref:     invoiceRef,
        movement_date:   dateVal,
        notes:           document.getElementById('si-notes')?.value || null,
      });
      // Update stock level and unit cost
      const newLevel = Number(item?.stock_level||0) + row.qty;
      await sb.patch('stock_items?id=eq.'+row.itemId, {
        stock_level: newLevel,
        current_unit_cost: row.cost,
        last_received: dateVal,
      });
    }
    toast('Stock received — '+rows.length+' item'+(rows.length!==1?'s':''));
    await Promise.allSettled([loadStockItems(), loadStockMovements()]);
    state.showStockIn = false; render();
  } catch(e) { let m=e.message; try{const p=JSON.parse(m);m=p.message||p.error||m;}catch(_){} toast('Error: '+m,'error'); }
};

  const item = state.stockItems.find(i=>String(i.id)===String(itemId));
  if (qty > Number(item?.stock_level||0)) { toast('Only '+item?.stock_level+' '+item?.unit+' in stock','error'); return; }
  try {
    const lineTotal = qty * Number(item?.current_unit_cost||0);
    await sb.post('stock_movements', {
      stock_item_id:  Number(itemId),
      stock_name:     item?.stock_name || null,
      movement_type:  'out',
      quantity:       qty,
      unit:           item?.unit || 'each',
      unit_cost:      item?.current_unit_cost || 0,
      total_cost:     lineTotal,
      issued_to:      document.getElementById('so-to')?.value || null,
      reason:         document.getElementById('so-reason')?.value || null,
      movement_date:  document.getElementById('so-date')?.value || new Date().toISOString().slice(0,10),
    });
    await sb.patch('stock_items?id=eq.'+itemId, { stock_level: Math.max(0, Number(item.stock_level) - qty) });
    if (lineTotal > 0) {
      await sb.post('cost_entries', {
        category:'stock', description:'Stock issued: '+item.stock_name+' x'+qty,
        quantity:qty, unit_cost:item.current_unit_cost||0, total_cost:lineTotal,
        entry_date:document.getElementById('so-date')?.value||new Date().toISOString().slice(0,10), source:'stock_out',
      });
    }
    toast(qty+' '+item.unit+' '+item.stock_name+' issued');
    await Promise.allSettled([loadStockItems(), loadStockMovements(), loadCostEntries()]);
    state.showStockOut = false; state.selectedStock = null; render();
  } catch(e) { let m=e.message; try{const p=JSON.parse(m);m=p.message||p.error||m;}catch(_){} toast('Error: '+m,'error'); }
};

window.submitCostEntry = async () => {
  const desc = document.getElementById('ce-desc')?.value?.trim();
  if (!desc) { toast('Description required','error'); return; }
  const qty       = Number(document.getElementById('ce-qty')?.value       || 1);
  const unitCost  = Number(document.getElementById('ce-unit-cost')?.value || 0);
  const totalCost = Number(document.getElementById('ce-total')?.value     || 0);
  const finalTotal = totalCost > 0 ? totalCost : qty * unitCost;
  try {
    await sb.post('cost_entries', {
      description:   desc,
      category:      document.getElementById('ce-cat')?.value || 'other',
      cost_centre_id:document.getElementById('ce-cc')?.value ? Number(document.getElementById('ce-cc').value) : null,
      quantity:      qty,
      unit_cost:     unitCost || (finalTotal / (qty||1)),
      total_cost:    finalTotal,
      supplier:      document.getElementById('ce-supplier')?.value || null,
      recorded_by:   document.getElementById('ce-by')?.value || null,
      entry_date:    document.getElementById('ce-date')?.value || new Date().toISOString().slice(0,10),
      source:        'manual',
    });
    toast('Cost logged');
    await loadCostEntries();
    state.showCostEntry = false; render();
  } catch(e) { let m=e.message; try{const p=JSON.parse(m);m=p.message||p.error||m;}catch(_){} toast('Error: '+m,'error'); }
};

function buildTaskDetail() {

  const logs = (state.taskLogs||[]).filter(l => l.task_id === task.id);
  const pc = priorityColor(task.priority);
  const sc = statusColor(task.status);
  const assigned = task.assigned_to ? state.staff.find(s=>s.id===task.assigned_to) : null;
  return `
  <div class="modal-overlay" onclick="if(event.target===this){state.selectedTask=null;render()}">
    <div class="modal" style="width:560px;max-height:90vh;overflow-y:auto">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px">
        <div>
          <div style="font-size:18px;font-weight:700;color:var(--text);margin-bottom:6px">${escHtml(task.title)}</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <span class="badge" style="color:${pc};border-color:${pc}">${task.priority}</span>
            <span class="badge" style="color:${sc};border-color:${sc}">${(task.status||'').replace(/_/g,' ')}</span>
            ${task.type?`<span class="badge" style="color:var(--text-muted);border-color:var(--border)">${task.type}</span>`:''}
          </div>
        </div>
        <button class="btn btn-ghost" onclick="state.selectedTask=null;render()">✕</button>
      </div>
      ${task.description?`<p style="font-size:13px;color:var(--text-sec);margin-bottom:14px">${escHtml(task.description)}</p>`:''}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;font-family:'JetBrains Mono',monospace;font-size:10px">
        ${assigned?`<div><span style="color:var(--text-muted)">ASSIGNED TO</span><div style="color:var(--text);margin-top:2px">${escHtml(assigned.preferred_name||assigned.name)}</div></div>`:''}
        ${task.due_date?`<div><span style="color:var(--text-muted)">DUE</span><div style="color:var(--text);margin-top:2px">${fmtDate(task.due_date)}</div></div>`:''}

      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
        <button class="btn btn-ghost" style="font-size:10px" onclick="openEditTask(${task.id})">✎ Edit</button>
        <button class="btn btn-ghost" style="font-size:10px" onclick="showModal('logWork')">+ Log Work</button>
        ${task.status!=='completed'?`<button class="btn btn-primary" style="font-size:10px" onclick="quickCompleteTask(${task.id})">✓ Mark Complete</button>`:''}
      </div>
      <div class="card-title">Work Log (${logs.length})</div>
      ${logs.length?`<div class="col-gap" style="gap:6px">
        ${logs.map(l=>`<div style="padding:8px 10px;background:var(--surface);border-radius:var(--r);border:1px solid var(--border)">
          <div style="font-size:12px;color:var(--text)">${escHtml(l.note||'')}</div>
          <div style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted);margin-top:4px">${fmtDate(l.log_date)} ${l.logged_by?'· '+escHtml(l.logged_by):''}</div>
        </div>`).join('')}
      </div>`:`<div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-muted)">No work logged yet</div>`}
    </div>
  </div>`;
}

window.submitChecklistRun = async () => {
  const tmplId = state.runningChecklist;
  const tmpl = state.hsChecklists.find(t=>Number(t.id)===Number(tmplId));
  const by = document.getElementById('cl-by')?.value;
  if (!tmpl) { toast('No checklist selected','error'); return; }
  const items = Array.isArray(tmpl.items)?tmpl.items:JSON.parse(tmpl.items||'[]');
  const results={};let outOfRange=false;
  items.forEach((item,idx)=>{
    if(item.type==='bool'){const val=document.querySelector(`input[name="cl-${idx}"]:checked`)?.value;results[item.key]=val==='true';if(val==='false')outOfRange=true;}
    else if(item.type==='number'){const val=parseFloat(document.getElementById(`cl-${idx}-val`)?.value||'');results[item.key]=isNaN(val)?null:val;if(!isNaN(val)){if(item.min!==undefined&&val<item.min)outOfRange=true;if(item.max!==undefined&&val>item.max)outOfRange=true;}}
    else{results[item.key]=document.getElementById(`cl-${idx}-val`)?.value||null;}
  });
  const byStaff = state.staff.find(s=>String(s.id)===String(by));
  try {
    await sb.post('hs_checklist_runs',{
      template_id:Number(tmplId), completed_by:by?Number(by):null,
      completed_by_name:byStaff?byStaff.name:null,
      completed_at:new Date().toISOString(), results:JSON.stringify(results),
      out_of_range:outOfRange, notes:document.getElementById('cl-notes')?.value||null,
    });
    toast(outOfRange?'⚠ Checklist submitted — FAILURES detected':'✓ Checklist passed');
    await loadHsChecklistRuns(); state.showHsChecklistRun=false; state.runningChecklist=null; render();
  } catch(e){let m=e.message;try{const p=JSON.parse(m);m=p.message||p.error||m;}catch(_){}toast('Error: '+m,'error');}
};

window.grnLoadInvoice = (inv) => {
  // Pre-fill invoice number from a previous order
  const el = document.getElementById('si-invoice');
  if (el) el.value = inv + '-COPY';
  // Pre-fill lines from that invoice
  const lines = (state.stockMovements||[])
    .filter(m => m.invoice_ref === inv && String(m.supplier_id) === String(state.grnSupplierId));
  // Clear existing rows and rebuild
  const container = document.getElementById('si-items');
  if (!container) return;
  container.innerHTML = '';
  grnRowCount = 0;
  lines.forEach(l => {
    const items = state.stockItems || [];
    const div = document.createElement('div');
    div.innerHTML = buildGrnRow(grnRowCount, items);
    const row = div.firstElementChild;
    container.appendChild(row);
    // Pre-select the item and fill qty/cost
    const itemSel = document.getElementById('si-item-'+grnRowCount);
    const qtySel  = document.getElementById('si-qty-'+grnRowCount);
    const costSel = document.getElementById('si-cost-'+grnRowCount);
    if (itemSel) itemSel.value = l.stock_item_id || '';
    if (qtySel)  qtySel.value  = l.quantity || '';
    if (costSel) costSel.value = l.unit_cost || '';
    grnRowCount++;
  });
  if (grnRowCount === 0) addGrnRow();
  grnCalc();
};

window.saveInlineNewItem = async () => {
  const name = document.getElementById('ni-name')?.value?.trim();
  if (!name) { toast('Item name required','error'); return; }
  const data = {
    stock_name: name,
    item_code:  document.getElementById('ni-code')?.value || null,
    category:   document.getElementById('ni-cat')?.value  || 'general_consumables',
    unit:       document.getElementById('ni-unit')?.value || 'each',
    minimum_level: Number(document.getElementById('ni-min')?.value || 0),
    stock_level: 0,
    current_unit_cost: 0,
    preferred_supplier_id: state.grnSupplierId ? Number(state.grnSupplierId) : null,
  };
  try {
    await sb.post('stock_items', data);
    toast('Item added — '+name);
    await loadStockItems();
    hideInlineNewItem();
    // Clear the new item form
    ['ni-name','ni-code','ni-min'].forEach(id => { const el=document.getElementById(id); if(el) el.value=''; });
    // Refresh the GRN row dropdowns — rebuild rows preserving current values
    const rows = document.querySelectorAll('[id^="si-row-"]');
    rows.forEach(row => {
      const idx = row.id.replace('si-row-','');
      const curItem = document.getElementById('si-item-'+idx)?.value;
      const curQty  = document.getElementById('si-qty-'+idx)?.value;
      const curCost = document.getElementById('si-cost-'+idx)?.value;
      const curUnit = document.getElementById('si-unit-'+idx)?.value;
      const curVat  = document.getElementById('si-vat-'+idx)?.checked;
      const div = document.createElement('div');
      div.innerHTML = buildGrnRow(Number(idx), state.stockItems);
      const newRow = div.firstElementChild;
      row.parentNode.replaceChild(newRow, row);
      // Restore values
      const sel = document.getElementById('si-item-'+idx);
      if (sel) sel.value = curItem || '';
      const q = document.getElementById('si-qty-'+idx); if(q) q.value=curQty||'';
      const co = document.getElementById('si-cost-'+idx); if(co) co.value=curCost||'';
      const u = document.getElementById('si-unit-'+idx); if(u) u.value=curUnit||'each';
      const v = document.getElementById('si-vat-'+idx); if(v) v.checked=curVat||false;
    });
    grnCalc();
  } catch(e) { let m=e.message; try{const p=JSON.parse(m);m=p.message||p.error||m;}catch(_){} toast('Error: '+m,'error'); }
};

window.submitStockAdjust = async () => {
  const itemId = state.selectedStock;
  const type   = document.getElementById('sa-type')?.value;
  const qty    = parseFloat(document.getElementById('sa-qty')?.value||0);
  const reason = document.getElementById('sa-reason')?.value?.trim();
  if (!qty||!reason) { toast('Quantity and reason required','error'); return; }
  const item = state.stockItems.find(s=>s.id===itemId);
  let newLevel = Number(item?.stock_level||0);
  if (type==='add') newLevel += qty;
  else if (type==='remove') newLevel = Math.max(0, newLevel - qty);
  else newLevel = qty;
  try {
    await sb.patch('stock_items?id=eq.'+itemId,{stock_level:newLevel});
    await sb.post('stock_movements',{stock_item_id:itemId,stock_name:item?.stock_name,
      movement_type:type==='add'?'in':'out',quantity:qty,unit:item?.unit,
      total_cost:0,reason,movement_date:new Date().toISOString().slice(0,10)});
    toast('Stock adjusted'); await loadStockItems(); await loadStockMovements(); closeModal('stockAdjust'); render();

};
